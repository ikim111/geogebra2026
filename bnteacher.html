<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>배움노트 채점본 보기 (교사용)</title>
<!--
  배움노트 정리 수행평가 — 교사용 보기
  관리 비밀번호를 넣고 반을 고르면 그 반 학생 목록(번호·총점)이 나오고, 학생을 누르면 채점된 배움노트 사진을 볼 수 있다.
  학생용(bnview.html)과 달리 인증번호가 필요 없고, 목차 잠금이 닫혀 있어도 볼 수 있다.
  목록은 api/bn-view.js(admin)에서 받는다. 관리 페이지(mgmt) 목차의 「배움노트 정리 수행평가 결과 보기」가 이 화면으로 온다(?classNo=반).
-->
<style>
  :root{--ink:#1f2328;--ink2:#52514e;--line:#e3e6ea;--blue:#1565c0;--red:#c62828;--green:#2e7d32;}
  *{box-sizing:border-box;}
  body{margin:0;background:#f4f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .top{background:#1A1D20;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;flex-wrap:wrap;}
  .top a{color:#e8eaed;text-decoration:none;background:#2a2e33;border:1px solid #444;border-radius:6px;padding:6px 10px;font-size:14px;}
  .top b{font-size:15px;}
  .top .up{margin-left:auto;background:#7b1fa2;border-color:#7b1fa2;font-weight:bold;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 60px;}
  .card{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  label{display:block;font-weight:bold;font-size:13.5px;margin:0 0 4px;}
  input,select{padding:8px 10px;border:1px solid #c5cad1;border-radius:8px;font-size:15px;font-family:inherit;}
  button{border:none;border-radius:8px;padding:9px 16px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;background:var(--blue);color:#fff;}
  button:disabled{background:#9fb6d3;cursor:default;}
  .msg{font-size:14px;margin-top:8px;min-height:18px;} .bad{color:var(--red);}
  .pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:bold;}
  .pill.on{background:#e8f5e9;color:var(--green);} .pill.off{background:#fdecea;color:var(--red);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px;}
  .stu{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;background:#fff;font-family:inherit;}
  .stu:hover{border-color:var(--blue);}
  .stu.on{border-color:var(--blue);background:#e8f1fc;}
  .stu b{display:block;font-size:17px;} .stu span{font-size:13px;color:var(--ink2);}
  .stu.low span{color:var(--red);font-weight:bold;}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .head .who{font-size:18px;font-weight:bold;} .head .sc{color:var(--ink2);} .head .sc b{font-size:28px;color:var(--red);}
  .nav{margin-left:auto;display:flex;gap:6px;}
  .nav button{background:#fff;color:var(--blue);border:1.5px solid var(--blue);padding:6px 12px;font-size:14px;}
  .pg{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden;}
  .pg .cap{font-size:13px;color:var(--ink2);padding:5px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .pg .cap a{color:var(--blue);text-decoration:none;}
  .pg img{display:block;width:100%;height:auto;}
  .note{font-size:13px;color:var(--ink2);}
</style>
</head>
<body>
<div class="top"><a href="mgmt-9x3k7f2p.html" title="관리 페이지로">🏠</a><b>📊 배움노트 정리 수행평가 — 교사용 보기</b><a class="up" href="bnadmin.html">📤 채점본 올리기</a></div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div><label for="key">관리 비밀번호</label><input type="password" id="key" autocomplete="off" style="width:150px;"></div>
      <div><label for="cls">반</label><select id="cls"><option value="5">5반</option><option value="6">6반</option><option value="7">7반</option><option value="8">8반</option></select></div>
      <div><button id="loadBtn">불러오기</button></div>
      <div class="msg" id="msg" style="flex:1 1 200px;margin:0 0 9px;"></div>
    </div>
    <div id="list"></div>
  </div>
  <div id="viewer"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY_LS = 'bn_admin_key';
try { $('key').value = localStorage.getItem(KEY_LS) || ''; } catch (e) {}
const qs = new URLSearchParams(location.search), qc = String(qs.get('classNo') || '').trim();
if (/^[5-8]$/.test(qc)) $('cls').value = qc;
let MAP = null, NUMS = [], CUR = -1;

async function load(){
  const key = $('key').value.trim(), cls = $('cls').value, msg = $('msg');
  if (!key) { msg.innerHTML = '<span class="bad">관리 비밀번호를 넣어 주세요.</span>'; return; }
  try { localStorage.setItem(KEY_LS, key); } catch (e) {}
  $('loadBtn').disabled = true; msg.textContent = '⏳ 불러오는 중…'; $('viewer').innerHTML = ''; CUR = -1;
  try {
    const r = await fetch('/api/bn-view', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ admin: key, cls }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    MAP = j.map; NUMS = MAP ? Object.keys(MAP.students || {}).sort((a, b) => a - b) : [];
    msg.innerHTML = `${cls}반 · 학생에게 <span class="pill ${j.unitOpen?'on':'off'}">${j.unitOpen?'공개 중':'비공개'}</span> <span class="note">(공개/비공개는 관리 페이지 목차의 잠금으로 바꿔요)</span>`;
    if (!MAP) { $('list').innerHTML = '<p class="note" style="margin:10px 0 0;">아직 올린 채점본이 없어요. 위의 「📤 채점본 올리기」에서 올릴 수 있어요.</p>'; return; }
    const avg = NUMS.length ? (NUMS.reduce((s, n) => s + (+MAP.students[n].score || 0), 0) / NUMS.length).toFixed(1) : '-';
    $('list').innerHTML = `<p class="note" style="margin:10px 0 0;">${NUMS.length}명 · 평균 ${avg}점 · 마지막 올림 ${new Date(MAP.ts).toLocaleString('ko-KR')} — 학생을 누르면 채점본이 아래에 나와요.</p>
      <div class="grid">${NUMS.map((n, i) => { const s = MAP.students[n]; return `<button type="button" class="stu${+s.score < 10 ? ' low' : ''}" data-i="${i}"><b>${esc(n)}번</b><span>${esc(s.score)}점</span></button>`; }).join('')}</div>`;
  } catch (e) { msg.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  $('loadBtn').disabled = false;
}
function show(i){
  if (i < 0 || i >= NUMS.length) return;
  CUR = i; const n = NUMS[i], s = MAP.students[n];
  document.querySelectorAll('.stu').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  $('viewer').innerHTML = `<div class="card"><div class="head"><span class="who">${esc($('cls').value)}반 ${esc(n)}번</span><span class="sc">총점 <b>${esc(s.score)}</b>/ ${esc(MAP.max || 20)}</span>
      <span class="nav"><button type="button" id="prevS" ${i===0?'disabled':''}>◀ 이전 학생</button><button type="button" id="nextS" ${i===NUMS.length-1?'disabled':''}>다음 학생 ▶</button></span></div>
    ${(s.pages || []).map((u, k) => `<div class="pg"><div class="cap"><span>${k + 1}쪽 / ${(s.pages||[]).length}쪽</span><a href="${esc(u)}" target="_blank" rel="noopener">🔍 새 창에서 크게</a></div><img src="${esc(u)}" alt="${k + 1}쪽" loading="lazy"></div>`).join('')}</div>`;
  $('prevS').addEventListener('click', () => show(i - 1)); $('nextS').addEventListener('click', () => show(i + 1));
  $('viewer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('loadBtn').addEventListener('click', load);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
$('list').addEventListener('click', e => { const b = e.target.closest('.stu'); if (b) show(+b.dataset.i); });
document.addEventListener('keydown', e => { if (CUR < 0 || e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') show(CUR - 1); if (e.key === 'ArrowRight') show(CUR + 1); });
if ($('key').value) load();
</script>
</body>
</html>

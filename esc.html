<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나침반 방탈출 — 들어오기</title>
<style>
  /* 2026-11-25 선생님 요청(시안 승인): 방탈출 전용 주소. 학년·반만 골라 선생님 TV 화면을 따라간다(이름 없음, 모둠 디벗 1대). 3학년 전환기 수업용 */
  body{margin:0;background:#f5f6f8;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#222;min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:center;padding:12px 14px;background:#1a237e;color:#fff;font-size:17px;font-weight:bold}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:14px;border-top:6px solid #1a237e;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:26px 20px;width:100%;max-width:560px;box-sizing:border-box;text-align:center}
  .big{font-size:56px;line-height:1}
  h1{color:#1a237e;font-size:28px;margin:10px 0 4px}
  .hint{color:#555;font-size:15px;margin:0 0 16px}
  .lab{font-size:14px;color:#555;margin:14px 0 8px;font-weight:bold}
  .row{display:flex;gap:10px;justify-content:center}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  button.c{min-height:48px;border-radius:10px;border:2px solid #1565c0;background:#fff;color:#1565c0;font-weight:bold;font-size:16px;cursor:pointer;padding:0 16px}
  button.c.on{background:#1565c0;color:#fff}
  .go{margin-top:20px;min-height:54px;width:100%;border-radius:12px;border:0;background:#2e7d32;color:#fff;font-weight:bold;font-size:18px;cursor:pointer}
  .go:disabled{background:#fff;border:2px dashed #b0b6bb;color:#9aa0a6;cursor:default}
  .why{font-size:13px;color:#777;margin-top:8px}
  .foot{font-size:13px;color:#888;margin-top:14px}
  @media (max-width:420px){ .grid{grid-template-columns:repeat(4,1fr)} }
</style></head><body>
<div class="top">🧭 나침반 방탈출</div>
<div class="wrap"><div class="card">
  <div class="big">🧭</div><h1>나침반 방탈출</h1><p class="hint">학년과 반을 고르고 [들어가기]를 누르세요.</p>
  <div class="lab">학년</div><div class="row" id="gr"></div>
  <div class="lab">반</div><div class="grid" id="cl"></div>
  <button class="go" id="go" disabled>들어가기 ▶</button><div class="why" id="why">👉 학년과 반을 골라요</div>
  <div class="foot">이름은 넣지 않아요 · 모둠 디벗 1대로 해요</div>
</div></div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  let g = null, c = null;
  try{ const v = JSON.parse(localStorage.getItem('escPick')||'null'); if(v){ g = v.g; c = v.c; } }catch(e){}
  const paint = () => {
    $('gr').innerHTML = [2,3].map(x => `<button class="c${g===x?' on':''}" data-g="${x}">${x}학년</button>`).join('');
    $('cl').innerHTML = Array.from({length:12}, (_, i) => `<button class="c${c===i+1?' on':''}" data-c="${i+1}">${i+1}반</button>`).join('');
    const ok = g && c; $('go').disabled = !ok; $('why').textContent = ok ? `${g}학년 ${c}반으로 들어가요` : '👉 학년과 반을 골라요';
  };
  document.body.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.g){ g = +b.dataset.g; paint(); }
    else if(b.dataset.c){ c = +b.dataset.c; paint(); }
    else if(b.id === 'go' && g && c){
      try{ localStorage.setItem('escPick', JSON.stringify({g, c})); }catch(e){}
      const cls = g === 2 ? String(c) : g + '-' + c;   // 2학년은 기존 반 방('5')을 그대로, 3학년은 '3-5'
      location.href = 'studentesc.html?classNo=' + encodeURIComponent(cls);
    }
  });
  paint();
})();
</script>
</body></html>

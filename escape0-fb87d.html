<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>붉은 나침반 — 연습 (모둠 디벗)</title>
<link rel="stylesheet" href="escape-core.css">
</head><body>
<script>
/* 🧭 붉은 나침반 연습(선원 훈련소) — 1·2·3회 모두 이 연습으로 사용법을 익힌다 (2026-11-01)
   연습 카드: 연습 시작, 10 양동이(빨강), 20 밧줄(파랑), 11 구멍 난 바가지(파랑), 21 벌점, 30 쪽지(숨은 5), 5 우물 지도(기계), X 훈련 상자(자물쇠 0804), 9 훈련 수료증(마지막) */
window.EG = {
  mode:'practice', ep:'연습', title:'선원 훈련소',
  kinds:{'연습':'G', 10:'R', 20:'B', 11:'B', 21:'P', 30:'G', 5:'Gr', X:'Y', 9:'G'},
  codes:{ X:{code:'0804', ok:{msg:'철컥! 훈련 상자가 열렸다. 안에 무언가 들어 있다!', open:['9'], clear:['X']}} },
  wrongCodes:{},
  hints:{
    10:['빨강 카드는 파랑 카드와 합쳐요.','파랑 카드는 밧줄(20)과 바가지(11)예요.'],
    30:['쪽지를 자세히 보세요.','쪽지 위에 작은 숫자가 있어요. 그 번호의 카드를 펼쳐요.','5번 카드를 펼치세요.'],
    5:['쪽지(30)에 적힌 자리를 지도에서 찾아요.','x좌표가 먼저, y좌표가 나중이에요.','(2, 3)을 누르세요.'],
    9:['훈련 수료증이 마지막 카드예요.','🏁 탈출을 누르고 9를 넣어요.']},
  mach:{ 5:{t:'우물 지도',s:'쪽지에 적힌 자리를 누르고 확인을 누르세요.',type:'img',img:'escape1-wellmap.jpg',
      xs:[0,1,2,3,4,5,6].map(k=>11+12.95*k), ys:[81,67,53,39,25],
      check:(x,y)=> x==2&&y==3 ? {ok:true,msg:'삽으로 파 보니 훈련 상자가 나왔다!',open:['X'],clear:['30','5']}
        : (x==3&&y==2) ? {ok:false,msg:'x좌표가 먼저, y좌표가 나중이에요.'} : {ok:false,msg:'쪽지에 적힌 자리를 다시 보세요.'} } },
  hidden:()=>'우물에서 건진 쪽지(30)를 자세히 보세요. 작은 숫자가 숨어 있어요.',
  endCard:9,
  reflect:'이제 진짜 모험이에요!<small>연습 카드(노란 뒷면)는 모두 치우고, 본게임 카드(파란 뒷면)를 번호가 보이게 쌓아 두세요. 시작 카드만 펼쳐 둬요.</small>',
  next:{url:'escape1-k7q2m.html', label:'⚓ 1회 「찢어진 지도」 시작하기'},
  steps:[
    {name:'카드 펼치기', text:c=>`<b>연습 시작</b> 카드를 펼치고 소리 내어 읽어 보세요.<br>그림 속 번호 ${c(10)}${c(20)}${c(11)} 는 <b>지금 펼쳐도 되는 카드</b>예요. 세 장을 찾아 펼쳐요.`, next:'세 장을 펼쳤어요'},
    {name:'합치기와 함정', text:c=>`빨강 마름모 ◆ 와 파랑 동그라미 ● 는 <b>숫자를 더해서</b> 합쳐요.<br>양동이 ${c(10)} + 바가지 ${c(11)} = <b>21</b>. 21번 카드를 펼쳐 보세요.`,
      todo:()=>`21번은 <b>벌점 카드</b>예요! 반짝이는 <b>⏳ 벌점</b>을 누르세요.`, glow:['pen'], wait:e=>e==='pen'},
    {name:'다시 합치기', text:c=>`벌점 카드 ${c(21)} 만 치워요. 합쳤던 카드는 그대로 둬요.<br>이번엔 양동이 ${c(10)} + 밧줄 ${c(20)} = <b>30</b>. 30번 카드를 펼쳐요.`,
      todo:(c)=>`30번 카드 위에 <b>줄 그은 번호</b>가 있죠? 그 카드(10, 20)는 다 썼으니 치워요.`, next:'30번을 펼치고 정리했어요'},
    {name:'숨은 번호', text:c=>`30번 그림 속에 <b>작은 숫자</b>가 숨어 있어요. 찾으면 그 번호의 카드를 펼쳐요.`,
      todo:()=>`못 찾겠으면 <b>🔍 숨은 번호</b>를 눌러 보세요.`, glow:['hid'], next:'숨은 번호 카드를 펼쳤어요'},
    {name:'힌트', text:c=>`${c(5)} 는 <b>초록 네모 기계 카드</b>예요. 풀기 전에 힌트를 받아 볼까요?<br>막히면 <b>💡 힌트</b>에 <b>막힌 카드 번호</b>를 넣어요.`,
      todo:()=>`<b>💡 힌트</b> → <b>5</b> → 열어 보기. 같은 번호를 또 넣으면 다음 힌트, 세 번째는 <b>정답</b>이에요.`, glow:['hint'], wait:e=>e==='hint'},
    {name:'기계', text:c=>`이제 기계를 써요. <b>⚙️ 기계</b>에 카드 번호 <b>5</b>를 넣고 열어 보기를 누르세요.<br>지도가 나오면 쪽지에 적힌 자리를 누르고 <b>확인</b>!`,
      todo:()=>`기계는 한 자리 번호도 그대로 넣으면 돼요.`, glow:['machine'], wait:(e,a)=>e==='mach'&&+a===5},
    {name:'자물쇠', text:c=>`${c('X')} 는 <b>노랑 육각형 자물쇠 카드</b>예요.<br>카드에서 <b>네 자리 숫자</b>를 찾아 <b>🔒 자물쇠</b>에 넣어요.`,
      todo:()=>`틀리면 본게임에서는 1분을 잃어요. 연습은 괜찮아요.`, glow:['code'], wait:e=>e==='code'},
    {name:'탈출', text:c=>`${c(9)} 훈련 수료증을 펼쳤나요? 이게 <b>마지막 카드</b>예요.<br>본게임에서도 마지막 카드의 번호를 <b>🏁 탈출</b>에 넣으면 끝나요.`,
      todo:()=>`아래 <b>🏁 탈출</b>을 누르고 <b>9</b>를 넣어 보세요.`, showEnd:true}
  ]
};
</script>
<script src="escape-core.js"></script>

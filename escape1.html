<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>붉은 나침반 1회 — 모둠 디벗</title>
<link rel="stylesheet" href="escape-core.css">
</head><body>
<script>
/* 🧭 붉은 나침반 1회 「찢어진 지도」 본게임 (2026-11-01 공통 엔진으로 옮김, 연습은 escape0.html) */
window.EG = {
  mode:'main', ep:'제1회', title:'찢어진 지도', limitMin:45, zeroHint:true,
  kinds:{'시작':'G', 27:'R',40:'R',42:'R',59:'R',31:'R',61:'R', 23:'B',5:'B',51:'B',14:'B',26:'B',38:'B',
         52:'Gr',44:'Gr',73:'Gr',3:'Gr', 94:'Y',6:'Y', 47:'P',63:'P',85:'P',69:'P'},
  startMsg:'<b>시작</b> 카드를 펼치세요. 시간이 흐르기 시작했어요!',
  codes:{
    94:{code:'3242', ok:{msg:'철컥! 금고가 열렸다.', open:['58'], clear:['94','49']}},
    6:{code:'2000', ok:{msg:'"딱 맞는 길이로군!" 보트를 탔다.', open:['86'], clear:['6','24']}} },
  wrongCodes:{'2242':'하나를 빠뜨렸어요. 사다리꼴을 다시 보세요.',
    '5000':'그건 세 <b>등대</b>까지의 거리(외심)예요. 호수는 <b>해안 길</b>에 접해요.','4000':'그건 지름이에요.','0002':'단위를 m로 바꿔 보세요.','0020':'단위를 m로 바꿔 보세요.'},
  hints:{
    0:['그림 속 번호 카드를 모두 펼쳐 보세요.','빨강 27과 파랑 23을 합쳐 보세요.','27 + 23 = 50번 카드를 펼치세요.'],
    18:['일기에 적힌 사각형의 정의를 기억해 두세요.','찢어진 지도(52)에서 쓰여요.'],
    52:['AB와 DC는 평행하고 길이가 같아요.','B에서 C로 간 만큼, A에서도 똑같이 가 보세요.','D는 (3, 5)예요.'],
    49:['액자 뒤에 무언가 있어요.','작은 금고(94)를 펼쳐 보세요.'],
    94:['사각형마다 네 성질을 하나씩 따져 보세요.','❶ 대각선 길이가 같은 것은 정사각형·직사각형 말고 하나 더 있어요(등변사다리꼴).','3 · 2 · 4 · 2 → 3242'],
    58:['금고 안쪽 벽에 무언가 걸려 있어요.','꼬리표를 자세히 보세요.','꼬리표의 숫자는 51이에요. 51번 카드를 펼치세요.'],
    40:['쇠사슬을 여는 열쇠가 필요해요.','금고(94) 안을 잘 살펴보세요.','40 + 51 = 91번 카드를 펼치세요.'],
    91:['기운 돛대가 선장실 문을 막고 있어요.','돛대 세우는 법(2)과 도르래(44)를 보세요.'],
    2:['두 밧줄의 길이가 같으면 어떤 삼각형이 생길까요?','이등변삼각형의 꼭지각의 이등분선은 밑변을 수직이등분해요.'],
    44:['이등변삼각형의 꼭지각의 이등분선은 밑변과 어떤 관계일까요?','밑변을 수직이등분해요. 각은 90°, 거리는 12의 절반.','90°, 6m'],
    4:['선장의 메모를 다시 읽어 보세요.','둥근 나무 바퀴(14)가 키 받침에 맞아요.','59 + 14 = 73번 카드를 펼치세요.'],
    26:['녹슨 열쇠는 어디에 쓰일까요? 메모를 보세요.','키 받침에는 둥근 나무 바퀴를 끼워야 해요. 녹슨 열쇠는 함정이에요.'],
    59:['바퀴가 어디 있을까요? 선장실을 찾아보세요.','도르래(44)로 돛대를 먼저 세워 보세요.'],
    73:['이등변삼각형의 두 밑각의 크기는 같아요.','세 각의 합은 180°예요. (180 − 40) ÷ 2','70°'],
    29:['섬에서는 두 갈래를 나눠 풀 수 있어요.','등대(31)와 안내판(24)부터 보세요.'],
    31:['멀리 있는 것을 볼 때 쓰는 물건이 있었죠?','망원경(5)과 합쳐 보세요.','31 + 5 = 36번 카드를 펼치세요.'],
    3:['세 점에서 같은 거리에 있는 점은 외심이에요.','직각삼각형의 외심은 빗변의 중점에 있어요.','(4, 3)'],
    6:['세 변에 모두 접하는 원의 중심은 내심이에요.','넓이 = ½ × 반지름 × (세 변의 합)','24 = ½ × r × 24 → r = 2km = 2000m'],
    61:['지도 조각이 하나 더 있어요.','호수 가운데 섬(86)에서 찾을 수 있어요.','61 + 38 = 99번 카드를 펼치세요.']},
  mach:{
    52:{t:'찢어진 지도',s:'찢긴 꼭짓점 D가 있던 점을 누르세요.',type:'grid',pts:{A:[1,1],B:[6,1],C:[8,5]},xmax:13,ymax:6,poly:[[1,1],[6,1],[8,5]],
      check:(x,y)=> x==3&&y==5 ? {ok:true,msg:'찢긴 귀퉁이에 <b>"35번 부두"</b>라고 적혀 있다!',open:['35'],clear:['52','50','18']}
        : (x==13&&y==5) ? {ok:false,msg:'평행사변형은 되지만 A→B→C→D 순서가 아니에요.'} : {ok:false,msg:'마주 보는 변이 평행하지 않아요.'}},
    44:{t:'도르래',s:'두 다이얼을 맞춰 돛대를 바로 세우세요.',type:'dial2',l1:'① 돛대와 갑판이 이루는 각',l2:'② 돛대 밑 → 한쪽 밧줄 끝',
      check:(a,m)=> a==90&&m==6 ? {ok:true,msg:'끼익… 돛대가 바로 섰다! 막혀 있던 선장실 문이 열렸다.',open:['4'],clear:['2','44']}
        : a==70 ? {ok:false,msg:'70°는 <b>돛</b>의 밑각이에요. 지금은 <b>돛대</b>가 갑판과 이루는 각이에요.'}
        : m==12 ? {ok:false,msg:'12m는 두 밧줄 끝 사이 <b>전체</b> 거리예요.'}
        : a!=90 ? {ok:false,msg:'돛대와 갑판이 이루는 각이 아니에요. 두 밧줄 길이가 같다는 걸 떠올려 보세요.'} : {ok:false,msg:'각은 맞았어요! 거리를 다시 보세요.'}},
    73:{t:'나침반 키',s:'키를 몇 도 돌릴까요?',type:'dial',
      check:a=> a==70 ? {ok:true,msg:'바람이 돛을 가득 채운다. 섬이 보인다!',open:['29'],clear:['73','91','96','42']}
        : a==40 ? {ok:false,msg:'꼭지각만큼 돌렸더니 배가 제자리에서 빙글…'} : a==140 ? {ok:false,msg:'두 밑각을 더한 만큼 돌려서 너무 돌았어요.'} : {ok:false,msg:'배가 엉뚱한 쪽으로 간다…'}},
    3:{t:'삽',s:'파 볼 점을 누르세요.',type:'grid',pts:{P:[0,0],Q:[8,0],R:[0,6]},xmax:8,ymax:6,poly:[[0,0],[8,0],[0,6],[0,0]],
      check:(x,y)=> x==4&&y==3 ? {ok:true,msg:'삽 끝에 무언가 걸렸다! 상자 발견!',open:['43'],clear:['3','36']}
        : (x==2&&y==2) ? {ok:false,msg:'여기는 세 <b>해안 길</b>에서 같은 거리예요. <b>등대</b>에서는 아니에요!'}
        : ((x==3||x==2)&&y==2) ? {ok:false,msg:'세 등대의 가운데쯤이지만 거리가 같지 않아요. 모래뿐이다.'}
        : ((x==4&&y==0)||(x==0&&y==3)) ? {ok:false,msg:'두 등대에서만 같은 거리예요.'} : {ok:false,msg:'모래뿐이다…'}} },
  hidden:S=> S.solved[94] && !S.solved[73] ? '금고 속(58) 안쪽에 걸린 것을 자세히 보세요.' : '지금 펼친 카드에는 숨은 번호가 없어요.',
  endCard:99,
  reflect:'되돌아보기: 이번 회에 쓴 성질을 모둠이 함께 말해 보세요.<small>평행사변형 · 사각형의 대각선 · 이등변삼각형 · 외심 · 내심</small>'
};
</script>

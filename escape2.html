<script>
/* 🧭 나침반 시리즈 2회 푸른 나침반 「강을 건너, 동굴로」 닮음·피타고라스 (2026-11-01 내용 검수판, 카드 데이터는 tools/escape/rounds/r2.py) */
window.EG = {
  mode:'main', series:'푸른 나침반', ep:'제2회', title:'강을 건너, 동굴로', limitMin:45, zeroHint:true,
  kinds:{'시작':'G', 25:'R',70:'R', 21:'B',30:'B',34:'B',14:'B',22:'B',19:'B',3:'B',
         59:'Gr',18:'Gr',27:'Gr',37:'Gr', 83:'Y',41:'Y',48:'Y', 46:'P',55:'P',84:'P',89:'P',92:'P'},
  startMsg:'시간이 흐르기 시작했어요!',
  codes:{
    41:{code:'1200', ok:{msg:'절벽 높이는 12m! 이제 맞는 사다리를 고를 수 있다.', open:['18'], clear:[]}},
    48:{code:'3012', ok:{msg:'드르륵… 삼각형 그림이 옆으로 밀려났다!', open:['58'], clear:['48']}},
    83:{code:'1810', ok:{msg:'쿠르릉… 돌문이 옆으로 밀려났다!', open:['76'], clear:['83']}} },
  wrongCodes:{
    '1018':'FG를 먼저, HI를 나중에 써요.', '0019':'비를 거꾸로 세웠어요. 절벽은 사람보다 훨씬 커요.', '1820':'HI는 A에서 H까지(5칸)를 AB 전체(15칸)와 비교해요.', '1215':'FG는 A에서 F까지(9칸)를 AB 전체(15칸)와 비교해요.', '1220':'A에서 F까지 9칸, A에서 H까지 5칸, AB는 15칸이에요.', '1530':'중점은 없어요. 눈금 칸을 세어 비를 하나씩 보세요.',
    '0012':'단위를 cm로 바꿔 보세요. (벽화라면 ①의 나머지 각을 구해 보세요.)', '0300':'눈높이와 거리를 곱하기만 했어요. 두 삼각형의 닮음비를 찾아보세요.', '0533':'비를 거꾸로 세웠어요. 절벽은 사람보다 훨씬 커요.', '0200':'비를 거꾸로 세웠어요. 절벽은 사람보다 훨씬 커요.',
    '3112':'②: 4, 6, 9는 2, 3, 4의 2배가 아니에요(4, 6, 8이어야 해요).', '3002':'③: 세 변의 비가 4 : 5 : 6으로 같아요(SSS).', '3032':'③: 두 각을 모르니 AA가 아니라 세 변의 비로 따져요.', '2012':'①: 나머지 한 각도 구해 보세요. 세 각이 같아요.', '3013':'④: 두 변의 비와 그 끼인각이 같아요(SAS).'},
  hints:{
    0:['그림 속 번호 카드를 모두 펼쳐 보세요.','갈고리 밧줄(37)을 강 폭만큼 던지면 상자를 끌어와 도끼를 얻어요.','막대(7)로 세 나무의 키를 구하고, 강가에서 떨어진 거리도 생각해 강 폭(8m)보다 길게 뻗는 나무와 도끼를 합쳐요.'],
    37:['C에서 출발하는 두 변의 중점 M, N을 이은 선분 MN은 어떤 성질이 있을까요? MN 길이는 시작 카드의 꼬리표에 있어요.','삼각형의 두 변의 중점을 이은 선분은 나머지 변의 절반이에요(MN ∥ AB).','AB = 4 × 2 = 8m'],
    7:['해가 같은 각도로 비치면 막대와 나무, 그림자가 만드는 삼각형은 닮음이에요.','키 : 그림자 = 1 : 1.5','망고나무 8m(강 폭과 같음), 대나무 10m(강가에서 3m 안쪽이라 7m만 뻗음), 야자나무 9m'],
    61:['강 위로 뻗는 길이가 강 폭보다 길어야 다리가 돼요. 강 폭은 갈고리 밧줄(37)로 구한 8m예요.','나무의 키를 막대(7)로 구하고, 강가에서 떨어진 거리는 빼세요.','야자나무(34)는 9m라 8m 강을 건너요. 대나무는 10 − 3 = 7m뿐이에요. 25 + 34 = 59'],
    59:['막대(7)의 키와 그림자의 비를 이용해요.','1 : 1.5 = (나무 키) : 13.5','9m'],
    53:['절벽을 오를 방법과 갈매기의 쪽지, 두 갈래예요.','측량 일지(41)와 쪽지(65)를 보세요.'],
    41:['사람·거울·눈높이로 작은 삼각형, 절벽·거울·꼭대기로 큰 삼각형이 생겨요. 눈높이는 할머니의 지팡이(53)에 새겨져 있어요.','빛이 같은 각으로 튀어 나가니 두 삼각형은 AA 닮음. 닮음비는 3 : 24 = 1 : 8','1.5 × 8 = 12m = 1200cm → 1200'],
    48:['닮음 조건은 SSS(세 변의 비), SAS(두 변의 비와 끼인각), AA(두 각)예요.','① 나머지 각을 구해 보세요. ② 2·3·4와 4·6·9의 비가 같은지 따져 보세요.','① AA=3, ② 아님=0, ③ SSS=1(4:5:6 = 8:10:12), ④ SAS=2 → 3012'],
    18:['절벽, 땅, 사다리가 직각삼각형을 만들어요. 사다리가 빗변, 절벽 높이는 측량 일지(41)로 구한 12m예요.','(밑변)² + 12² = 13²','(밑변)² = 169 − 144 = 25 → 5m'],
    65:['쪽지 그림을 구석까지 잘 보세요.','작은 숫자가 숨어 있어요.','27번 카드를 펼치세요.'],
    27:['"직선 10걸음"은 꺾어 가는 거리가 아니라 곧게 잰 거리예요.','강가 길 위의 점 (x, 6)까지 거리: x² + 6² = 10²','(8, 6)'],
    83:['FG ∥ BC이면 AF : AB = FG : BC. BC 길이는 동굴 입구 카드(90)에 있어요.','AF = 5 + 4 = 9칸, AH = 5칸, AB = 15칸이라 AF : AB = 3 : 5, AH : AB = 1 : 3','FG = 30 × 3/5 = 18, HI = 30 × 1/3 = 10 → 1810'],
    70:['진짜 열쇠는 바위 뒤 벽(58)의 그림자 자국에 꼭 맞는 열쇠예요. 바위는 벽화(48)를 풀면 밀려나요.','횃불·열쇠·그림자가 만드는 두 삼각형은 닮음이고, 닮음비는 2뼘 : 3뼘 = 2 : 3이에요.','12 × 2/3 = 8cm 열쇠(3)와 열쇠 구멍(70)을 합치세요. 70 + 3 = 73'],
    58:['횃불에서 열쇠 양 끝을 지나 벽까지 빛이 곧게 가요. 두 삼각형(횃불-열쇠, 횃불-그림자)은 닮음이에요.','열쇠 : 그림자 = 2 : 3, 그림자 12cm → 열쇠 = 12 × 2/3','8cm 열쇠(3)와 열쇠 구멍(70)을 합치세요. 70 + 3 = 73']},
  hintSame:{21:7,30:7,34:7,25:61,90:83,76:70,3:58,14:58,22:58,19:58,63:58},
  mach:{
    37:{t:'갈고리 밧줄',s:'밧줄을 몇 m 풀어 던질까?',type:'dial',unit:'m',max:30,
      check:a=> a==8 ? {ok:true,msg:'휙… 척! 갈고리가 쇠고리에 걸렸다. 상자를 끌어왔다!',open:['61'],clear:[]}
        : a==4 ? {ok:false,msg:'밧줄이 강 한가운데에 풍덩! 4m는 두 말뚝 사이예요.'} : a==2 ? {ok:false,msg:'밧줄이 코앞에 떨어졌다. 중점을 이은 선분과 AB의 관계를 거꾸로 썼어요.'} : a==16 ? {ok:false,msg:'갈고리가 바위를 훌쩍 넘어갔다. 두 배의 두 배를 했어요.'}
        : a<8 ? {ok:false,msg:'밧줄이 강에 풍덩! 모자라요.'} : {ok:false,msg:'갈고리가 바위를 넘어가 버렸다. 너무 길어요.'}},
    59:{t:'나무 베기',s:'야자나무의 키는 몇 m일까?',type:'dial',unit:'m',max:30,
      check:a=> a==9 ? {ok:true,msg:'쿵! 9m 나무가 8m 강을 가로질러 쓰러졌다. 통나무 다리 완성!',open:['53'],clear:['59','25','21','30','34','7','61','37']}
        : (a==13||a==14) ? {ok:false,msg:'그건 그림자 길이예요. 나무의 키는 그림자보다 짧아요(1 : 1.5).'} : (a==20||a==21) ? {ok:false,msg:'그림자에 1.5를 곱했어요. 나무는 그림자보다 짧아요.'}
        : {ok:false,msg:'막대의 키와 그림자의 비를 다시 보세요.'}},
    18:{t:'사다리',s:'사다리 발을 절벽에서 몇 m 떨어진 땅에 놓을까?',type:'dial',unit:'m',max:40,
      check:a=> a==5 ? {ok:true,msg:'사다리가 절벽 끝에 딱 걸렸다! 영차영차 올라간다.',open:['90'],clear:['18','41']}
        : a==1 ? {ok:false,msg:'13에서 12를 뺐어요. 피타고라스 정리로 구해 보세요.'} : a==25 ? {ok:false,msg:'13과 12를 더했어요.'} : a==12 ? {ok:false,msg:'12m는 절벽 높이예요.'} : a==13 ? {ok:false,msg:'13m는 사다리 길이예요.'}
        : {ok:false,msg:'사다리가 절벽 끝에 닿지 않아요.'}},
    27:{t:'모래밭 지도',s:'상자가 묻힌 점을 누르세요. 빨간 줄 = 강가 길, 한 칸 = 1걸음',type:'grid',pts:{O:[0,0]},xmax:12,ymax:9,poly:[[0,6],[12,6]],
      check:(x,y)=> x==8&&y==6 ? {ok:true,msg:'삽 끝에 상자가 걸렸다!',open:['63'],clear:['27','65']}
        : (x==4&&y==6) ? {ok:false,msg:'가로 4 + 세로 6 = 10은 꺾어 간 거리예요. 직선 거리는 아니에요.'}
        : y==6 ? {ok:false,msg:'강가 길 위지만 O에서 직선으로 10걸음이 아니에요.'}
        : (x*x+y*y==100) ? {ok:false,msg:'O에서 10걸음은 맞지만 강가 길 위가 아니에요.'} : {ok:false,msg:'모래뿐이다…'}} },
  hidden:S=> S.solved[59] && !S.solved[27] ? '검은 갈매기의 쪽지(65)를 구석까지 자세히 보세요.' : '지금 펼친 카드에는 숨은 번호가 없어요.',
  pens:{46:{m:2,msg:'망고나무의 키는 강 폭과 똑같은 8m였어요. 강 폭보다 <b>길어야</b> 걸쳐요.'},
    55:{m:2,msg:'대나무는 강가에서 3m 안쪽에 있어서 10m 가운데 7m만 강 위로 뻗었어요.'},
    84:{m:2,msg:'그림자는 열쇠보다 커요. 12에 3/2를 곱하면 거꾸로예요.'},
    89:{m:2,msg:'12 ÷ 3에서 멈췄어요. 열쇠는 2뼘 자리에 있으니 2를 곱해야 해요.'},
    92:{m:2,msg:'그림자 자국 길이 그대로예요. 그림자는 열쇠보다 커요.'}},
  endCard:73,
  reflect:'되돌아보기: 이번 회에 쓴 성질을 모둠이 함께 말해 보세요.<small>삼각형의 닮음 조건 · 그림자와 닮음 · 피타고라스 정리 · 중점을 이은 선분 · 평행선과 선분의 길이의 비 · 닮음비(그림자)</small>'
};
</script>

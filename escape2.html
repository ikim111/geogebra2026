<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>붉은 나침반 2회 — 모둠 디벗</title>
<link rel="stylesheet" href="escape-core.css">
</head><body>
<script>
/* 🧭 붉은 나침반 2회 「강을 건너, 동굴로」 닮음·피타고라스 (2026-11-01 내용 검수판, 카드 데이터는 tools/escape/rounds/r2.py) */
window.EG = {
  mode:'main', ep:'제2회', title:'강을 건너, 동굴로', limitMin:45, zeroHint:true,
  kinds:{'시작':'G', 25:'R',70:'R', 21:'B',34:'B',29:'B',14:'B',22:'B',
         59:'Gr',18:'Gr',27:'Gr', 37:'Y',83:'Y', 46:'P',84:'P',92:'P'},
  startMsg:'시간이 흐르기 시작했어요!',
  codes:{
    37:{code:'0800', ok:{msg:'철컥! 측량 상자가 열렸다.', open:['61'], clear:['37']}},
    83:{code:'1520', ok:{msg:'쿠르릉… 돌문이 옆으로 밀려났다!', open:['76'], clear:['83','90']}} },
  wrongCodes:{
    '0008':'단위를 cm로 바꿔 보세요.', '0050':'비를 거꾸로 세웠어요. 큰 삼각형의 변이 더 길어야 해요.', '2400':'BC가 CD의 몇 배인지 생각해 보세요.',
    '2015':'DE를 먼저, FG를 나중에 써요.', '1510':'AF : FB = 2 : 1이면 AF : AB는 2 : 3이에요.', '3020':'중점을 이은 선분은 밑변의 절반이에요.'},
  hints:{
    0:['그림 속 번호 카드를 모두 펼쳐 보세요.','나무를 베려면 도끼(25)와 나무를 합쳐요. 어느 나무가 좋을지 먼저 따져 봐요.','막대·그림자로 두 나무의 키를 구하고, 측량 상자(37)로 강 폭을 알아내요.'],
    37:['A, B, C와 E, D, C로 두 삼각형을 만들어 보세요.','∠ACB와 ∠ECD는 맞꼭지각, AB ∥ DE라서 엇각도 같아요 → 두 삼각형은 닮음(AA).','BC : DC = 12 : 3 = 4 : 1이니 AB = 2 × 4 = 8m = 800cm → 0800'],
    7:['해가 같은 각도로 비치면 막대와 나무, 그림자가 만드는 삼각형은 닮음이에요.','키 : 그림자 = 1 : 1.5','왼쪽 나무 6m, 오른쪽 나무 10m'],
    61:['강 폭보다 긴 나무여야 다리가 돼요.','두 나무의 키를 막대(7)로 구해 보세요.','오른쪽 나무(34)가 10m라 8m 강을 건널 수 있어요. 25 + 34 = 59'],
    59:['막대(7)의 키와 그림자의 비를 이용해요.','1 : 1.5 = (나무 키) : 15','10m'],
    53:['절벽을 오를 방법과 갈매기의 쪽지, 두 갈래예요.','사다리(18)와 쪽지(65)를 보세요.'],
    18:['절벽, 땅, 사다리가 직각삼각형을 만들어요.','사다리 길이는 빗변이에요. (빗변)² = 12² + 5²','13m'],
    65:['쪽지 그림을 구석까지 잘 보세요.','작은 숫자가 숨어 있어요.','27번 카드를 펼치세요.'],
    27:['"직선 10걸음"은 꺾어 가는 거리가 아니라 곧게 잰 거리예요.','강가 길 위의 점 (x, 6)까지 거리: x² + 6² = 10²','(8, 6)'],
    83:['D, E가 중점이면 DE ∥ BC이고 DE는 BC의 절반이에요.','FG ∥ BC이면 AF : AB = FG : BC. AF : AB = 2 : 3','DE = 15, FG = 20 → 1520'],
    58:['닮음비 1 : 4는 진짜가 그림의 4배라는 뜻이에요.','3 × 4 = ?','12cm 열쇠(29)와 열쇠 구멍(70)을 합치세요. 70 + 29 = 99']},
  hintSame:{21:7,34:7,25:61,90:83,76:58,70:58,29:58,14:58,22:58,63:58},
  mach:{
    59:{t:'나무 베기',s:'오른쪽 야자나무의 키를 맞추세요.',type:'dial',unit:'m',max:30,
      check:a=> a==10 ? {ok:true,msg:'쿵! 10m 나무가 8m 강을 가로질러 쓰러졌다. 통나무 다리 완성!',open:['53'],clear:['59','25','21','34','7','61']}
        : a==15 ? {ok:false,msg:'15m는 그림자 길이예요.'} : a==6 ? {ok:false,msg:'6m는 왼쪽 나무의 키예요.'} : a==22 ? {ok:false,msg:'그림자에 1.5를 곱했어요. 나무는 그림자보다 짧아요.'}
        : {ok:false,msg:'막대의 키와 그림자의 비를 다시 보세요.'}},
    18:{t:'사다리',s:'절벽 꼭대기에 딱 닿는 사다리 길이는?',type:'dial',unit:'m',max:30,
      check:a=> a==13 ? {ok:true,msg:'사다리가 절벽 끝에 딱 걸렸다! 영차영차 올라간다.',open:['90'],clear:['18']}
        : a==17 ? {ok:false,msg:'12와 5를 더했어요. 직각삼각형의 빗변은 그렇게 구하지 않아요.'} : a==7 ? {ok:false,msg:'12에서 5를 뺐어요.'} : a==12 ? {ok:false,msg:'12m는 절벽 높이예요. 사다리는 비스듬히 서요.'}
        : {ok:false,msg:'사다리가 절벽 끝에 닿지 않아요.'}},
    27:{t:'모래밭 지도',s:'상자가 묻힌 점을 누르세요. 빨간 줄 = 강가 길, 한 칸 = 1걸음',type:'grid',pts:{O:[0,0]},xmax:9,ymax:7,poly:[[0,6],[9,6]],
      check:(x,y)=> x==8&&y==6 ? {ok:true,msg:'삽 끝에 상자가 걸렸다!',open:['63'],clear:['27','65']}
        : (x==4&&y==6) ? {ok:false,msg:'가로 4 + 세로 6 = 10은 꺾어 간 거리예요. 직선 거리는 아니에요.'}
        : y==6 ? {ok:false,msg:'강가 길 위지만 O에서 직선으로 10걸음이 아니에요.'}
        : (x*x+y*y==100) ? {ok:false,msg:'O에서 10걸음은 맞지만 강가 길 위가 아니에요.'} : {ok:false,msg:'모래뿐이다…'}} },
  hidden:S=> S.solved[59] && !S.solved[27] ? '검은 갈매기의 쪽지(65)를 구석까지 자세히 보세요.' : '지금 펼친 카드에는 숨은 번호가 없어요.',
  endCard:99,
  reflect:'되돌아보기: 이번 회에 쓴 성질을 모둠이 함께 말해 보세요.<small>삼각형의 닮음 조건 · 그림자와 닮음 · 피타고라스 정리 · 중점을 이은 선분 · 평행선과 선분의 길이의 비 · 닮음비</small>'
};
</script>
<script src="escape-core.js"></script>
</body></html>

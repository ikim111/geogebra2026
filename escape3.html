<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>붉은 나침반 3회 — 모둠 디벗</title>
<link rel="stylesheet" href="escape-core.css">
</head><body>
<script>
/* 🧭 붉은 나침반 3회 「동굴 속 보물 방」 경우의 수·확률 (2026-11-01 내용 검수판, 카드 데이터는 tools/escape/rounds/r3.py) */
window.EG = {
  mode:'main', ep:'제3회', title:'동굴 속 보물 방', limitMin:45, zeroHint:true,
  kinds:{'시작':'G', 43:'R',65:'R',25:'R',27:'R',56:'R', 17:'B',26:'B',34:'B',
         36:'Gr',28:'Gr',45:'Gr', 52:'Y',75:'Y',57:'Y',49:'Gr', 69:'P',59:'P',61:'P',90:'P'},
  startMsg:'시간이 흐르기 시작했어요!',
  codes:{
    52:{code:'0014', ok:{msg:'드르륵… 석판이 밀려났다.', open:['80'], clear:['52']}},
    75:{code:'2010', ok:{msg:'명부의 자물쇠가 풀렸다.', open:['33'], clear:['75']}},
    57:{code:'0708', ok:{msg:'끼이익… 보물 방 문이 열렸다!', open:['85'], clear:['57','98']}} },
  wrongCodes:{
    '0009':'굴을 이어서 갈 때는 더하지 않고 곱해요.', '0024':'물길은 굴과 이어 가는 길이 아니라 따로 가는 길이에요. 곱하지 말고 더해요.', '0012':'바로 가는 물길도 세어야 해요. 할아버지의 편지를 보세요.', '0007':'광장을 지나는 길은 곱해서 세요.',
    '1020':'갑판장·항해사를 먼저, 망보기를 나중에 써요.', '2020':'망보기 2명은 순서가 없어요. 두 번씩 세었어요.', '1010':'갑판장과 항해사는 다른 자리라 순서가 있어요.', '2510':'갑판장과 항해사는 같은 사람이 될 수 없어요.', '3015':'선원은 그물침대 수(5명)만큼이에요. 선장은 따로예요.', '1210':'선원은 그물침대 수(5명)만큼이에요.',
    '0108':'그건 세 개 모두 뒷면이 나올 확률이에요.', '0102':'동전이 3개라 경우는 8가지예요.', '0308':'"적어도 한 개"는 1개, 2개, 3개가 앞면인 경우를 모두 포함해요.', '0408':'"적어도 한 개는 앞면"이 아닌 경우는 몇 가지일까요?',
    },
  hints:{
    0:['그림 속 번호 카드를 모두 펼쳐 보세요.','석판 문(52)과 흔들다리(36), 두 갈래로 나눠 풀어요.','두 곳에서 얻은 물건을 합치면 길이 밝아져요. 43 + 17 = 60'],
    11:['광장을 지나는 길과 물길, 두 가지 방법이 있어요. 물길은 할아버지의 편지(14)에 있어요.','광장을 지나는 길: 3 × 4 (곱의 법칙), 물길과는 더해요(합의 법칙)','3 × 4 + 2 = 14 → 0014'],
    36:['선장은 맨 앞에 고정이니, 나머지 4명만 줄을 세우면 돼요.','4 × 3 × 2 × 1','24가지'],
    80:['횃불에 불을 붙일 것이 필요해요.','다리 건너편(68)을 보세요.','43 + 17 = 60번 카드를 펼치세요.'],
    60:['숙소 그림을 구석까지 잘 보세요.','작은 숫자가 숨어 있어요.','28번 카드를 펼치세요.'],
    75:['선원 수는 숙소(60)의 그물침대 수예요. 갑판장과 항해사는 자리가 달라요(순서 있음), 망보기 2명은 자리가 같아요(순서 없음).','① 5 × 4 ② (5 × 4) ÷ 2','20, 10 → 2010'],
    28:['빨간 구슬을 r개 넣으면 전체는 (r + 38)개예요.','r / (r + 38) = 1/3, 곧 빨강 : 파랑 = 1 : 2','19개'],
    57:['"적어도 한 개는 앞면"이 아닌 경우는 "모두 뒷면" 하나뿐이에요.','1 − (모두 뒷면일 확률) = 1 − 1/8','7/8 → 0708'],
    45:['모든 경우는 6 × 6 = 36가지예요. 낙서의 "합이 8 이상 15가지"를 쓰면 빨라요.','합이 7 이하 = 전체 − (합이 8 이상) = 36 − 15','1 + 2 + 3 + 4 + 5 + 6 = 21가지'],
    85:['두 갈래예요. 선원 명부(75)를 풀면 열쇠가, 받침대(49)를 풀면 상자가 나와요.','받침대 카드는 1~20이에요.'],
    49:['3의 배수 또는 4의 배수는 두 경우를 더하되, 둘 다인 수는 한 번만 세요. 카드는 보물 방(85)에 있는 1~20이에요.','3의 배수 6장, 4의 배수 5장, 둘 다인 수 12','6 + 5 − 1 = 10장'],
    92:['확률이 1인 사건은 "반드시" 일어나는 사건이에요. 상자마다 열리는 눈을 모두 적어 보세요.','6의 약수는 1, 2, 3, 6. 4 이상은 4, 5, 6. 5 이상은 5, 6. 7의 약수 중 주사위 눈은 1뿐. 0은 없어요.','1~6이 모두 들어가는 은빛 상자(65)와 열쇠(34)를 합치세요. 65 + 34 = 99'],
    33:['이 열쇠는 보물 방의 상자에 써요.','어느 상자인지는 받침대(49) 속 쪽지에 있어요.'],
    98:['이 쪽지는 보물 방 문(57)의 비밀번호예요.','"적어도 한 개는 앞면"이 아닌 경우는 "모두 뒷면" 하나뿐이에요.','1 − 1/8 = 7/8 → 0708']},
  hintSame:{52:11,14:11,68:80,43:80,17:80,26:80,34:33,65:92,25:92,27:92,56:92},
  mach:{
    49:{t:'돌 받침대',s:'3의 배수 또는 4의 배수가 적힌 카드는 몇 장?',type:'dial',unit:'장',max:20,
      check:a=> a==10 ? {ok:true,msg:'쿵… 받침대가 내려가고 상자 네 개가 올라왔다!',open:['92'],clear:['49']}
        : a==11 ? {ok:false,msg:'12는 3의 배수이면서 4의 배수예요. 두 번 세었어요.'} : a==6 ? {ok:false,msg:'4의 배수도 세어야 해요.'} : a==5 ? {ok:false,msg:'3의 배수도 세어야 해요.'} : a==1 ? {ok:false,msg:'그건 둘 다인 수(12)예요. "또는"은 어느 하나라도 되는 수예요.'}
        : {ok:false,msg:'받침대가 꿈쩍 않는다. 다시 세어 보세요.'}},
    36:{t:'흔들다리',s:'선장이 맨 앞일 때, 5명이 건너는 순서는 몇 가지?',type:'dial',unit:'가지',max:150,
      check:a=> a==24 ? {ok:true,msg:'순서를 정해 한 명씩 무사히 건넜다!',open:['68'],clear:['36']}
        : a==120 ? {ok:false,msg:'선장은 맨 앞에 고정이에요. 나머지 4명만 세요.'} : a==16 ? {ok:false,msg:'4 × 4를 했어요. 한 번 선 사람은 다시 설 수 없어요.'} : a==10 ? {ok:false,msg:'4 + 3 + 2 + 1을 했어요. 더하지 말고 곱해요.'} : a==12 ? {ok:false,msg:'4 × 3에서 멈췄어요. 나머지 자리도 세어요.'} : a==4 ? {ok:false,msg:'사람 수가 아니라 줄 서는 순서의 수예요.'}
        : {ok:false,msg:'다리가 크게 흔들린다! 다시 세어 보세요.'}},
    28:{t:'구슬 주머니',s:'빨간 구슬을 몇 개 넣을까?',type:'dial',unit:'개',max:120,
      check:a=> a==19 ? {ok:true,msg:'19/57 = 1/3! 주머니 밑바닥에서 쪽지가 나왔다.',open:['57'],clear:['28']}
        : a==38 ? {ok:false,msg:'38개면 빨강 38/76 = 1/2이에요.'} : (a==12||a==13) ? {ok:false,msg:'38을 3으로 나눴나요? 전체 가운데 빨강이 1/3이면 빨강 : 파랑 = 1 : 2예요.'} : a==114 ? {ok:false,msg:'파란 구슬 수에 3을 곱했어요. 그러면 빨강이 3/4이 돼요.'} : a==76 ? {ok:false,msg:'76개면 빨강 76/114 = 2/3이에요. 빨강 : 파랑을 거꾸로 잡았어요.'} : a==57 ? {ok:false,msg:'57은 빨강을 넣은 뒤 전체 구슬 수예요. 빨강은 몇 개일까요?'}
        : {ok:false,msg:'빨간 구슬을 꺼낼 확률이 1/3이 아니에요.'}},
    45:{t:'주사위 놀이판',s:'눈의 합이 7 이하가 되는 경우는 몇 가지?',type:'dial',unit:'가지',max:36,
      check:a=> a==21 ? {ok:true,msg:'딸깍! 놀이판 서랍이 열렸다.',open:['98'],clear:['45']}
        : a==12 ? {ok:false,msg:'(1, 4)와 (4, 1)처럼 A, B의 눈이 바뀌면 다른 경우예요.'} : a==6 ? {ok:false,msg:'그건 합이 꼭 7인 경우예요. 7 이하는 2~7을 모두 세요.'} : a==15 ? {ok:false,msg:'합이 6 이하까지만 셌어요. 7도 넣어요.'} : a==36 ? {ok:false,msg:'그건 모든 경우의 수예요.'}
        : {ok:false,msg:'서랍이 꿈쩍도 않는다. 다시 세어 보세요.'}} },
  hidden:S=> S.solved[52] && S.solved[36] && !S.solved[28] ? '불 밝힌 굴(60)을 구석까지 자세히 보세요.' : '지금 펼친 카드에는 숨은 번호가 없어요.',
  endCard:99,
  reflect:'되돌아보기: 이번 회에 쓴 성질을 모둠이 함께 말해 보세요.<small>합의 법칙 · 곱의 법칙 · 줄 세우기 · 대표 뽑기 · 확률의 뜻 · 확률의 성질(0과 1) · 어떤 사건이 일어나지 않을 확률</small>'
};
</script>

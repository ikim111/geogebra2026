<!DOCTYPE html>

<script>
/* 🧭 나침반 시리즈 3회 황금 나침반 「동굴 속 보물 방」 경우의 수·확률 (2026-11-01 내용 검수판, 카드 데이터는 tools/escape/rounds/r3.py) */
window.EG = {
  mode:'main', series:'황금 나침반', ep:'제3회', title:'동굴 속 보물 방', limitMin:45, zeroHint:true,
  kinds:{'시작':'G', 43:'R',25:'R',27:'R',56:'R',5:'R',65:'R', 17:'B',26:'B',34:'B',23:'B', 88:'P',
         36:'Gr',28:'Gr',45:'Gr', 52:'Y',75:'Y',57:'Y',49:'Gr', 69:'P',59:'P',47:'R',61:'P',90:'P'},
  startMsg:'시간이 흐르기 시작했어요!',
  codes:{
    52:{code:'1214', ok:{msg:'드르륵… 석판이 밀려났다.', open:['80'], clear:['52']}},
    75:{code:'2025', ok:{msg:'명부의 자물쇠가 풀렸다.', open:['33'], clear:['75']}},
    57:{code:'1516', ok:{msg:'끼이익… 보물 방 문이 열렸다!', open:['85'], clear:['57','98','60','65']}} },
  wrongCodes:{
    '0914':'굴을 이어서 갈 때는 더하지 않고 곱해요. 3 + 4가 아니라 3 × 4예요.', '1224':'물길은 굴과 이어 가는 길이 아니라 따로 가는 길이에요. 모든 길은 곱하지 말고 더해요.', '1212':'🔥+⛵는 배로 가는 물길까지 더한 모든 길이에요. 할아버지의 편지(14)를 보세요.', '0714':'광장을 지나는 길은 곱해서 세요.', '0709':'🔥 굴로 이어 가는 길은 더하지 말고 곱해요(3 × 4). 🔥+⛵는 거기에 물길을 더해요.', '1412':'🔥가 굴로만 가는 길, 🔥+⛵가 모든 길이에요. 순서를 바꿔 썼어요.',
    '2520':'25시는 없어요! ① 갑판장·항해사가 시, ② 보초가 분이에요.', '2020':'보초는 같은 사람이 또 서도 돼요. 둘째 날에도 5명 모두 가능해요.', '2525':'갑판장과 항해사는 같은 사람이 맡을 수 없어요. 둘째 자리는 4명 중에서 골라요.', '1025':'갑판장과 항해사는 하는 일이 달라서, 누가 어느 자리인지에 따라 다른 경우예요.', '3036':'선원은 명부에 적힌 5명이에요. 선장은 따로예요.',
    '0116':'그건 네 닢 모두 뒷면이 나올 확률이에요. "적어도 한 닢은 앞면"은 그 나머지예요.', '0708':'금화는 세 닢이 아니라 네 닢이에요.', '1508':'금화 네 닢을 던지는 모든 경우는 2 × 2 × 2 × 2 = 16가지예요.', '0416':'"적어도 한 닢"은 1닢, 2닢, 3닢, 4닢이 앞면인 경우를 모두 포함해요.', '1416':'"적어도 한 닢은 앞면"이 아닌 경우는 모두 뒷면 하나뿐이에요.', '1615':'분수를 거꾸로 넣었어요. 위가 분자, 아래가 분모예요.'
    },
  hints:{
    0:['그림 속 번호 카드를 모두 펼쳐 보세요.','석판 문(52)과 흔들다리(36), 두 갈래로 나눠 풀어요.','두 곳에서 얻은 물건을 합치면 길이 밝아져요. 43 + 17 = 60'],
    11:['🔥는 굴로 가는 길, ⛵는 배로 가는 물길이에요. 물길은 할아버지의 편지(14)에 있어요.','🔥 굴로만: 3 × 4 (곱의 법칙), 🔥+⛵ 모든 길: 굴로만 가는 길 + 물길 (합의 법칙)','12, 14 → 1214'],
    36:['선장은 맨 앞에 고정이니, 나머지 4명만 줄을 세우면 돼요.','4 × 3 × 2 × 1','24가지'],
    80:['횃불에 불을 붙일 것이 필요해요.','다리 건너편(68)을 보세요.','43 + 17 = 60번 카드를 펼치세요.'],
    60:['숙소 그림을 구석까지 잘 보세요. 벽에 걸린 주머니도 카드예요.','작은 숫자가 숨어 있어요. 찾으면 빨간 구슬 단지와 합쳐 보세요.','숨은 번호 23(저울 주머니) + 구슬 단지 5 = 28번 카드를 펼치세요.'],
    75:['선원은 명부에 적힌 5명이에요. ①은 한 사람이 두 일을 못 맡고, ②는 같은 사람이 또 서도 돼요.','① 5 × 4 ② 5 × 5, 시계는 ①시 ②분','20시 25분 → 2025'],
    28:['빨간 구슬을 r개 넣으면 전체는 (r + 38)개예요.','r / (r + 38) = 1/3, 곧 빨강 : 파랑 = 1 : 2','19개'],
    57:['자물쇠가 분수 모양이에요. 비밀번호는 놀이판 서랍(98)의 쪽지에 있어요. 금화 네 닢을 던지는 모든 경우는 몇 가지일까요? 그중 "적어도 한 닢은 앞면"이 아닌 경우는 "모두 뒷면" 하나뿐이에요.','2 × 2 × 2 × 2 = 16가지, 그중 모두 뒷면 1가지를 빼요.','15/16 → 1516'],
    45:['모든 경우는 6 × 6 = 36가지예요. 이기는 쪽을 하나씩 세기 어려우면, 지는 쪽(합이 8 이상)을 세어 빼 보세요.','합이 8 이상: 2 + 3 + 4 + 5 + 1 = 15가지. 36 − 15 = ?','1 + 2 + 3 + 4 + 5 + 6 = 21가지'],
    85:['두 갈래예요. 선원 명부(75)를 풀면 열쇠가, 받침대(49)를 풀면 상자가 나와요.','받침대 카드는 1~20이에요.'],
    49:['카드는 보물 방(85)에 있는 1~20이에요. 4의 배수와 7의 배수를 따로 세어 보세요.','4의 배수 4, 8, 12, 16, 20 / 7의 배수 7, 14. 둘 다인 수는 없어요(합의 법칙).','4, 8, 12, 16, 20, 7, 14 — 이 7장을 누르세요.'],
    92:['확률이 1인 사건은 "반드시" 일어나는 사건이에요. 상자마다 열리는 눈을 모두 적어 보세요.','은빛: 1, 2, 3, 6과 4, 5, 6 / 나무: 1, 2, 3, 6과 5, 6 / 돌: 2, 3, 5와 2, 4, 6 / 검은: 7의 배수는 없어요.','1~6이 모두 들어가는 은빛 상자(47)와 열쇠(34)를 합치세요. 47 + 34 = 81'],
    33:['이 열쇠는 보물 방의 상자에 써요.','어느 상자인지는 받침대(49) 속 쪽지에 있어요.'],
    98:['이 쪽지는 보물 방 문(57)의 비밀번호예요. 자물쇠가 분수 모양이에요.','금화 네 닢의 모든 경우 16가지 중 모두 뒷면인 1가지를 빼요.','15/16 → 위 15, 아래 16 → 1516']},
  hintSame:{52:11,14:11,5:60,23:60,65:60,68:80,43:80,17:80,26:80,34:33,47:92,25:92,27:92,56:92},
  mach:{
    /* 2026-11-02 손으로 만지는 기계로 바꿈(선생님 요청). tries = 도구(check_round·build_text)가 시험할 입력 */
    49:{t:'돌 받침대',s:'4의 배수이거나 7의 배수가 적힌 카드만 모두 누르세요.',type:'pick',cols:5,cnt:'누른 카드',unit:'번 카드',
      items:Array.from({length:20},(_,i)=>({k:String(i+1),l:String(i+1)})),
      check:sel=>{ const A=new Set(['4','8','12','16','20','7','14']), on=new Set(sel), ok=sel.length===7&&sel.every(k=>A.has(k));
        if(ok) return {ok:true,msg:'쿵… 받침대가 내려가고 상자 네 개가 올라왔다!',open:['92'],clear:['49']};
        const has=k=>on.has(k), four=['4','8','12','16','20'].every(has), sev=['7','14'].every(has);
        if(sel.some(k=>!A.has(k))) return {ok:false,msg:'4의 배수도 7의 배수도 아닌 카드가 눌려 있어요. 받침대가 꿈쩍 않는다.'};
        if(four&&!sev) return {ok:false,msg:'7의 배수 카드도 눌러야 해요.'};
        if(sev&&!four) return {ok:false,msg:'4의 배수 카드도 눌러야 해요.'};
        return {ok:false,msg:'빠진 카드가 있어요. 1부터 20까지 하나씩 확인해 보세요.'}; },
      tries:[[['4','8','12','16','20','7','14']],[['4','8','12','16','20']],[['7','14']],[['4','9']]]},
    36:{t:'흔들다리 안전 고리',s:'숫자 바퀴를 돌려 건너는 순서의 수를 맞추세요.',type:'wheels',digits:2,unit:'가지',cap:'십의 자리 · 일의 자리',
      check:a=> a==24 ? {ok:true,msg:'철컥! 고리가 풀렸다. 순서대로 한 명씩 무사히 건넜다!',open:['68'],clear:['36']}
        : a==12 ? {ok:false,msg:'4 × 3에서 멈췄어요. 나머지 자리도 세어요.'} : a==16 ? {ok:false,msg:'4 × 4를 했어요. 한 번 선 사람은 다시 설 수 없어요.'} : a==10 ? {ok:false,msg:'4 + 3 + 2 + 1을 했어요. 더하지 말고 곱해요.'} : a==4 ? {ok:false,msg:'사람 수가 아니라 줄 서는 순서의 수예요.'} : a==20 ? {ok:false,msg:'5 × 4를 했어요. 선장은 맨 앞에 고정이고, 나머지 4명을 줄 세워요.'}
        : {ok:false,msg:'다리가 크게 흔들린다! 고리가 안 풀린다.'},
      tries:Array.from({length:100},(_,a)=>[a])},
    28:{t:'저울 주머니',s:'빨간 구슬을 넣고 「확인」으로 걸쇠를 당기세요.',type:'count',max:120,unit:'개',steps:[-5,-1,1,5],
      show:n=>`🔵 파란 구슬 38개<br>🔴 넣은 빨간 구슬 <b style="font-size:28px">${n}</b>개`,
      check:a=> a==19 ? {ok:true,msg:'19/57 = 1/3! 덜컥, 바닥 걸쇠가 풀렸다.',open:['57'],clear:['28','5','23']}
        : a==38 ? {ok:false,msg:'38개면 빨강 38/76 = 1/2이에요.'} : (a==12||a==13) ? {ok:false,msg:'38을 3으로 나눴나요? 전체 가운데 빨강이 1/3이면 빨강 : 파랑 = 1 : 2예요.'} : a==114 ? {ok:false,msg:'파란 구슬 수에 3을 곱했어요. 그러면 빨강이 3/4이 돼요.'} : a==76 ? {ok:false,msg:'76개면 빨강 76/114 = 2/3이에요. 빨강 : 파랑을 거꾸로 잡았어요.'} : a==57 ? {ok:false,msg:'57은 빨강을 넣은 뒤 전체 구슬 수예요. 빨강은 몇 개일까요?'} : a==0 ? {ok:false,msg:'아직 빨간 구슬을 하나도 넣지 않았어요.'}
        : {ok:false,msg:'걸쇠가 꿈쩍 않는다. 빨간 구슬을 꺼낼 확률이 1/3이 아니에요.'},
      tries:Array.from({length:121},(_,a)=>[a])},
    45:{t:'주사위 놀이판 서랍',s:'두 주사위 눈의 합이 7 이하가 되는 경우는 몇 가지?',type:'dial',unit:'가지',max:36,
      check:a=> a==21 ? {ok:true,msg:'딸깍! 놀이판 서랍이 열렸다.',open:['98'],clear:['45']}
        : a==12 ? {ok:false,msg:'(1, 4)와 (4, 1)처럼 A, B의 눈이 바뀌면 다른 경우예요.'} : a==6 ? {ok:false,msg:'그건 합이 꼭 7인 경우예요. 7 이하는 합이 2~7인 경우를 모두 세요.'} : a==15 ? {ok:false,msg:'그건 지는 쪽(합이 8 이상)의 수예요. 이기는 쪽은 몇 가지일까요?'} : a==36 ? {ok:false,msg:'그건 모든 경우의 수예요.'}
        : {ok:false,msg:'서랍이 꿈쩍도 않는다. 다시 세어 보세요.'}} },
  hidden:S=> S.solved[52] && S.solved[36] && !S.solved[28] ? '불 밝힌 굴(60)을 구석까지 자세히 보세요. 벽에 걸린 것이 있어요.' : '지금 펼친 카드에는 숨은 번호가 없어요.',
  pens:{69:{m:1,msg:'물이 아니라 불을 붙일 것이 필요해요.'}, 88:{m:1,msg:'주머니에 넣을 것은 금화가 아니라 빨간 구슬이에요. 금화는 다른 곳에 쓰여요.'},
    90:{m:2,msg:'소수 2, 3, 5와 짝수 2, 4, 6을 모으면 2, 3, 4, 5, 6. 1이 빠져 확률은 5/6이에요.'},
    59:{m:2,msg:'주사위에는 7의 배수가 없어요. 열릴 확률은 0이에요.'},
    61:{m:2,msg:'6의 약수 1, 2, 3, 6과 5 이상 5, 6을 모으면 1, 2, 3, 5, 6. 4가 빠져 확률은 5/6이에요.'}},
  endCard:81,
  prologue:'<b>황금 나침반을 찾아서</b>\n푸른 나침반의 바늘이 멈춘 곳은 절벽 아래 깊은 동굴이었다. 할아버지의 낡은 항해 일지 마지막 장: "세 번째 나침반은 황금빛이다. 그것은 우리 집안의 진짜 지도와 함께 보물 방에 잠들어 있다. 경우를 하나도 빠짐없이 세는 선원만 그 방에 닿을 것이다."\n그런데 계단 입구에 또 검은 깃털이 떨어져 있다. 검은 갈매기 해적단이 먼저 들어간 것이다! 횃불이 꺼지기 전, 45분 안에 그들보다 먼저 보물 방에 닿아야 한다.',
  epilogue:'황금 나침반을 들어 올리자 붉은·푸른·황금 세 나침반의 바늘이 한꺼번에 같은 쪽을 가리켰다. 진짜 지도에 그려진 섬, 할아버지가 끝내 가지 못한 곳이다.\n등대지기 할머니가 웃으며 말했다. "검은 갈매기는 길을 몰라서가 아니라 세는 법을 몰라서 헤맸단다. 너희는 할아버지의 선원이 될 자격이 있어."\n수평선 너머로 세 나침반이 가리키는 바다가 반짝였다.',
  reflect:'되돌아보기: 이번 회에 쓴 성질을 모둠이 함께 말해 보세요.<small>합의 법칙 · 곱의 법칙 · 한 줄로 세우기 · 확률의 뜻 · 확률의 성질(0과 1)</small>'
};
</script>

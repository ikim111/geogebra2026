<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생용 — 반/번호/이름 입력 및 과제 선택</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{ --blue:#1565c0; --green:#2e7d32; --gray:#616161; }
  *{box-sizing:border-box;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#1a237e;margin:0;min-height:100vh;color:#222;}

  #page1{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-card{background:#fff;border-radius:14px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.25);text-align:center;}
  .gate-card h1{font-size:19px;margin:0 0 4px;color:#1a237e;}
  .gate-card .gate-sub{font-size:12px;color:#888;margin:0 0 22px;}
  .gate-card label{display:block;text-align:left;font-size:13px;color:#555;margin:14px 0 6px;font-weight:bold;}
  .gate-card select, .gate-card input[type=text], .gate-card input[type=number]{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;background:#fff;}
  .class-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .class-btn{padding:14px 0;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:15px;font-weight:bold;color:#333;cursor:pointer;}
  .class-btn:hover{background:#f0f4ff;border-color:#9fb8ee;}
  .class-btn.selected{background:var(--blue);border-color:var(--blue);color:#fff;}
  .gate-start{width:100%;margin-top:22px;padding:14px;border:none;border-radius:8px;background:var(--green);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;}
  .gate-start:hover{background:#1b5e20;}
  #gateMsg{margin-top:12px;font-size:13px;color:#c62828;min-height:16px;}

  #page2{display:none;min-height:100vh;padding:24px 16px;}
  .wrap2{max-width:640px;margin:0 auto;}
  .top-card{background:#fff;border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:0 4px 24px rgba(0,0,0,.2);}
  .top-card h1{font-size:18px;margin:0 0 6px;color:#1a237e;}
  .top-card .who{font-size:14px;color:#444;}
  .top-card .who b{color:var(--blue);}
  .top-card .editBtn{margin-top:12px;font-size:12.5px;background:#fff3e0;border:1px solid #ffcc80;color:#e65100;padding:7px 12px;border-radius:6px;cursor:pointer;}

  .task-list{display:flex;flex-direction:column;gap:10px;}
  .task-link{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:16px 18px;text-decoration:none;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .1s;}
  .task-link:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.22);}
  .task-link .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;}
  .task-link .title{font-size:15px;font-weight:bold;}
  .task-link .arrow{margin-left:auto;color:#bbb;font-size:18px;}
  .task-link .badge{flex:0 0 auto;font-size:11px;font-weight:bold;padding:3px 9px;border-radius:10px;white-space:nowrap;}
  .task-link .badge.done{background:#e8f5e9;color:#2e7d32;}
  .task-link .badge.pending{background:#fff3e0;color:#e65100;}
  .task-link.locked{background:#eceff1;color:#9aa0a6;box-shadow:none;cursor:default;}
  .task-link.locked .num{background:#b0b6bb;}
  .task-link.locked .title{color:#9aa0a6;}
  .task-link.locked .arrow{color:#b0b6bb;}

  .chapter-title{font-size:13.5px;font-weight:bold;color:#fff;background:#1a237e;border-radius:8px;padding:9px 14px;margin:6px 0 2px;}
  .group-title{font-size:13px;font-weight:bold;color:#1a237e;padding:4px 4px 0;margin-top:4px;}
  .group-items{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
</style>
</head>
<body>

<div id="page1">
  <div class="gate-card">
    <h1>학생 정보 입력</h1>
    <p class="gate-sub">반 · 번호 · 이름을 입력하면 과제를 선택할 수 있어요</p>
    <label>반</label>
    <div class="class-grid" id="classGrid"></div>
    <input type="hidden" id="classNo">
    <label for="studentNumber">번호</label>
    <input type="number" id="studentNumber" placeholder="번호를 입력하세요" min="1" max="99">
    <label for="studentName">이름</label>
    <input type="text" id="studentName" placeholder="이름을 입력하세요">
    <button id="nextBtn" class="gate-start">다음 →</button>
    <div id="gateMsg"></div>
  </div>
</div>

<div id="page2">
  <div class="wrap2">
    <div class="top-card">
      <h1>과제를 선택하세요</h1>
      <div class="who"><b id="viewClass"></b>반 <b id="viewNumber"></b>번 <b id="viewName"></b></div>
      <button class="editBtn" id="editBtn">✏️ 정보 다시 입력하기</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
</div>

<script>
const PROFILE_KEY = 'ggb_profile_v1';
// 배포 도메인이 나중에 바뀌어도(Netlify → Vercel 등) 코드를 다시 고치지 않도록,
// 도메인을 하드코딩하지 않고 "같은 사이트의 상대 경로"로만 링크한다.
// student.html과 student0~6.html이 항상 같은 폴더(루트)에 함께 배포되어 있다면 이대로 잘 동작한다.
const BASE_URL = '';
// 단원이 늘어날 때는 STANDALONE_TASKS나 SECTIONS 안의 items 배열에 항목만 추가하면 된다
// (렌더링 함수는 이 구조를 그대로 따라가므로 따로 손댈 필요 없음).
const STANDALONE_TASKS = [
  {n:0, title:'지오지브라 연습', file:'student0.html'}
];
/* ============================================================
   선생님이 teacher.html에서 반별로 단원을 열고 닫을 수 있게 한 기능과,
   학생이 "결과 제출하기"를 눌러 완료했는지 보여주는 기능에 쓰인다.
   각 studentN.html의 FIREBASE_CONFIG/ACTIVITY_SUFFIX와 반드시 동일해야 한다.
   비워두면(또는 확인 중 오류가 나면) 예전처럼 모든 단원을 그냥 열어서 보여준다.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBK7NlpKOr1ozAXF96vS8p7YyjiNaAJlfI',
  authDomain: 'brojuntest.firebaseapp.com',
  databaseURL: 'https://brojuntest-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'brojuntest',
  storageBucket: 'brojuntest.firebasestorage.app',
  messagingSenderId: '426333242398',
  appId: '1:426333242398:web:b3ae216d5269ce13065a0f'
};
// n(단원번호) → 그 단원의 studentN.html이 쓰는 ACTIVITY_SUFFIX. 0단원(지오지브라 연습)은
// 제출 기능이 없어서 목록에 없다 — 없는 단원은 완료뱃지를 표시하지 않는다.
const ACTIVITY_SUFFIX = {1:'__isoc',2:'__perp',3:'__angbis',4:'__circum',5:'__incenter',6:'__extend',11:'__quad11',12:'__quad12',13:'__quad13'};
function sanitize(s){ return (s||'').trim().replace(/[.#$\[\]\/\s]+/g,'_').slice(0,30) || 'x'; }

const SECTIONS = [
  { chapter:'VI. 삼각형의 성질', groups:[
      { title:'1. 삼각형의 성질', items:[
        {n:1, title:'이등변삼각형의 성질', file:'student1.html'},
        {n:2, title:'수직이등분선의 성질', file:'student2.html'},
        {n:3, title:'각이등분선의 성질', file:'student3.html'},
        {n:4, title:'삼각형의 외심', file:'student4.html'},
        {n:5, title:'삼각형의 내심', file:'student5.html'},
        {n:6, title:'생각 넓히기', file:'student6.html'}
      ]},
      { title:'2. 사각형의 성질', items:[
        {n:11, title:'평행사변형의 성질', file:'student11.html'},
        {n:12, title:'평행사변형이 되는 조건 찾기', file:'student12.html'},
        {n:13, title:'평행사변형의 성질 활용', file:'student13.html'}
      ]}
  ]}
];

// 반 선택 버튼 채우기 (1~12반, 4개씩 3줄)
(function(){
  const grid=document.getElementById('classGrid');
  const hidden=document.getElementById('classNo');
  for(let i=1;i<=12;i++){
    const b=document.createElement('button');
    b.type='button';
    b.className='class-btn';
    b.textContent=i+'반';
    b.dataset.value=String(i);
    b.addEventListener('click', ()=>{
      hidden.value = String(i);
      grid.querySelectorAll('.class-btn').forEach(x=> x.classList.remove('selected'));
      b.classList.add('selected');
    });
    grid.appendChild(b);
  }
})();
function selectClassButton(classNo){
  document.getElementById('classNo').value = classNo || '';
  document.querySelectorAll('.class-btn').forEach(b=> b.classList.toggle('selected', b.dataset.value===String(classNo)));
}

function loadProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.classNo && obj.name) ? obj : null;
  }catch(e){ return null; }
}
function saveProfile(p){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({...p, ts:Date.now()})); }catch(e){}
}

function buildTaskLink(t, profile){
  const params = new URLSearchParams({classNo:profile.classNo, number:profile.number||'', name:profile.name});
  const a=document.createElement('a');
  a.className='task-link';
  a.dataset.n = t.n;
  a.href = BASE_URL + t.file + '?' + params.toString();
  const num=document.createElement('span'); num.className='num'; num.textContent=t.n;
  const title=document.createElement('span'); title.className='title'; title.textContent=t.title;
  const badge=document.createElement('span'); badge.className='badge'; badge.style.display='none';
  const arrow=document.createElement('span'); arrow.className='arrow'; arrow.textContent='›';
  a.appendChild(num); a.appendChild(title); a.appendChild(badge); a.appendChild(arrow);
  return a;
}

/* 선생님이 이 반에 각 단원을 열어줬는지, 그리고 학생이 "결과 제출하기"까지 눌러 완료했는지를
   Firebase에서 확인해서 목록에 반영한다. 0단원은 언제나 열려 있다(잠금 대상 아님).
   Firebase가 설정되지 않았거나 확인 중 오류가 나면 예전처럼 전부 열린 상태로 그대로 둔다
   (잠금 기능은 어디까지나 선택 기능이라 이것 때문에 과제 목록 자체를 못 보게 막지 않는다). */
function applyAccessAndCompletion(profile){
  if(!FIREBASE_CONFIG.apiKey) return;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    firebase.auth().signInAnonymously().then(cred=>{
      const uid = cred.user.uid;
      const accessKey = sanitize(profile.classNo) + '__access';
      firebase.database().ref('rooms/'+accessKey+'/units').once('value').then(snap=>{
        const access = snap.val() || {};
        document.querySelectorAll('.task-link').forEach(el=>{
          const n = parseInt(el.dataset.n, 10);
          if(n === 0) return; // 0단원은 항상 열려 있음
          const isOpen = access[n] === true;
          if(!isOpen){
            lockTaskLink(el);
          } else if(ACTIVITY_SUFFIX[n]){
            showCompletionBadge(el, n, uid, profile);
          }
        });
      }).catch(()=>{});
    }).catch(()=>{});
  }catch(e){}
}

function lockTaskLink(a){
  a.classList.add('locked');
  a.removeAttribute('href');
  a.addEventListener('click', e=> e.preventDefault());
  const arrow = a.querySelector('.arrow');
  if(arrow) arrow.textContent = '🔒';
}

function showCompletionBadge(a, n, uid, profile){
  const roomKey = sanitize(profile.classNo) + ACTIVITY_SUFFIX[n];
  const studentKey = uid + '_' + sanitize(profile.name);
  firebase.database().ref('rooms/'+roomKey+'/students/'+studentKey+'/submitted').once('value').then(snap=>{
    const badge = a.querySelector('.badge');
    if(!badge) return;
    if(snap.val() === true){
      badge.textContent = '✅ 완료'; badge.className = 'badge done';
    } else {
      badge.textContent = '⏳ 미완료'; badge.className = 'badge pending';
    }
    badge.style.display = '';
  }).catch(()=>{});
}

function buildTaskLinks(profile){
  const list=document.getElementById('taskList');
  list.textContent='';

  STANDALONE_TASKS.forEach(t=> list.appendChild(buildTaskLink(t, profile)));

  SECTIONS.forEach(sec=>{
    const chapterEl=document.createElement('div');
    chapterEl.className='chapter-title'; chapterEl.textContent=sec.chapter;
    list.appendChild(chapterEl);

    sec.groups.forEach(g=>{
      const groupTitleEl=document.createElement('div');
      groupTitleEl.className='group-title'; groupTitleEl.textContent=g.title;
      list.appendChild(groupTitleEl);

      const itemsWrap=document.createElement('div');
      itemsWrap.className='group-items';
      g.items.forEach(t=> itemsWrap.appendChild(buildTaskLink(t, profile)));
      list.appendChild(itemsWrap);
    });
  });
}

function showPage2(profile){
  document.getElementById('viewClass').textContent = profile.classNo;
  document.getElementById('viewNumber').textContent = profile.number || '-';
  document.getElementById('viewName').textContent = profile.name;
  buildTaskLinks(profile);
  document.getElementById('page1').style.display='none';
  document.getElementById('page2').style.display='block';
  applyAccessAndCompletion(profile);
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  const classNo = document.getElementById('classNo').value.trim();
  const number = document.getElementById('studentNumber').value.trim();
  const name = document.getElementById('studentName').value.trim();
  const msg = document.getElementById('gateMsg');
  if(!classNo){ msg.textContent = '반을 선택해주세요.'; return; }
  if(!number){ msg.textContent = '번호를 입력해주세요.'; return; }
  if(!name){ msg.textContent = '이름을 입력해주세요.'; return; }
  msg.textContent = '';
  const profile = {classNo, number, name};
  saveProfile(profile);
  showPage2(profile);
});

document.getElementById('editBtn').addEventListener('click', ()=>{
  const profile = loadProfile();
  if(profile){
    selectClassButton(profile.classNo);
    document.getElementById('studentNumber').value = profile.number || '';
    document.getElementById('studentName').value = profile.name;
  }
  document.getElementById('page2').style.display='none';
  document.getElementById('page1').style.display='flex';
});

// 이미 입력된 정보가 있으면 바로 과제 선택 화면으로
(function(){
  const profile = loadProfile();
  if(profile) showPage2(profile);
})();
</script>
</body>
</html>

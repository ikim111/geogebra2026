<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>방탈출 안내 — 모둠 디벗</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="escape-guide.js?v=20261125b"></script>
<style>
  /* 2026-11-06 다른 학생 활동 화면과 같게(시안 승인): 연한 회색 바탕, 남색 머리줄(🏠·종류 칩·제목), 흰 카드 + 회차 색 위 띠 */
  body{margin:0;background:#f5f6f8;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#222;min-height:100vh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1a237e;color:#fff;font-size:15px}
  .top a{background:#fff;color:#1a237e;text-decoration:none;min-width:44px;min-height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
  .top .chip{background:#1565c0;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:bold;white-space:nowrap}
  .top .who{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 16px 16px;max-width:1200px;width:100%;margin:0 auto;box-sizing:border-box}
  .card{background:#fff;border-radius:14px;border-top:6px solid var(--rc,#1a237e);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px;width:100%;max-width:calc((100vh - 170px)*16/9 + 28px);margin:0 auto;box-sizing:border-box}
  #slide{width:100%}
  .follow{text-align:center;font-size:14px;padding:10px 0 0;color:#555}
  .pv{display:flex;gap:10px;justify-content:center;padding-top:8px}
  .pv button{min-height:44px;padding:0 18px;border-radius:10px;border:2px solid #1565c0;background:#fff;color:#1565c0;font-weight:bold;font-size:15px}
  .wait{text-align:center;padding:26px 10px 18px}.wait .big{font-size:64px;line-height:1}.wait h2{color:#1a237e;font-size:clamp(24px,4vw,34px);margin:12px 0 6px}
  .wait p{font-size:17px;color:#444;margin:6px 0}.wait .step{display:inline-block;margin-top:14px;background:#f1f3f5;border-radius:10px;padding:10px 18px;font-size:17px;color:#222}
  .wait .sub2{font-size:14px;color:#888;margin-top:12px}
  .go{display:none;margin:12px auto 0;min-height:52px;padding:0 26px;border-radius:12px;border:0;background:#2e7d32;color:#fff;font-weight:bold;font-size:17px}
</style></head><body>
<div class="top"><a id="backLink" href="student.html" title="목차로">🏠</a><span class="chip">🧭 방탈출</span><span class="who" id="who"></span></div>
<div class="wrap"><div class="card" id="card"><div id="slide"></div><div class="follow" id="follow">📡 선생님 화면을 기다리는 중…</div></div>
  <div class="pv" id="pv" style="display:none"><button id="pPrev">◀ 이전</button><button id="pNext">다음 ▶</button></div>
  <button class="go" id="goBtn">🚀 게임 화면으로</button></div>
<script>
/* 2026-11-25 선생님 요청(시안 승인): 학생 디벗은 슬라이드 대신 '앞 화면(TV)을 보세요' 대기 화면 + 지금 TV가 어느 장인지.
   ?round= 가 없으면(방탈출 전용 주소 esc.html에서 들어옴) 선생님 화면이 고른 회차를 따라간다. 3학년은 classNo='3-5'. */
(function(){
  const q = new URLSearchParams(location.search), qRound = q.get('round');
  let round = Math.max(0, Math.min(3, parseInt(qRound||'0',10)||0));
  const preview = q.get('preview') === '1', classNo = q.get('classNo') || '';
  const $ = id => document.getElementById(id);
  if(/-/.test(classNo)) $('backLink').href = 'esc.html';
  EGUIDE.css();
  let page = 0;
  const head = () => { const R = EGUIDE.ROUNDS[round]; document.title = `방탈출 안내 — ${R.series}`;
    $('who').textContent = `${R.ep || '연습'} · ${R.series}${R.title ? ' - ' + R.title : ''}${classNo ? ' · ' + EGUIDE.cls(classNo) : ''}`;
    $('card').style.setProperty('--rc', R.color || '#1a237e'); };
  const slide = p => { page = Math.max(0, Math.min(EGUIDE.count(round)-1, p)); $('slide').innerHTML = EGUIDE.html(round, page); };
  const wait = (txt) => { const R = EGUIDE.ROUNDS[round], N = EGUIDE.count(round);
    $('slide').innerHTML = `<div class="wait"><div class="big">📺</div><h2>앞 화면(TV)을 보세요</h2><p>선생님이 <b>[🚀 시작!]</b>을 누르면 게임이 열려요.</p>`
      + `<div class="step">${txt || `지금: ${EGUIDE.label(round, page)} (${page+1} / ${N})`}</div><div class="sub2">${EGUIDE.cls(classNo)} · ${R.ep} ${R.series}</div></div>`; };
  const toGame = () => { location.href = EGUIDE.ROUNDS[round].game + '?go=1' + (classNo ? '&classNo=' + encodeURIComponent(classNo) + '&round=' + round : ''); };
  $('goBtn').onclick = toGame;
  head();
  if(preview || !classNo){   // 👀 교사 미리보기: TV 슬라이드를 혼자 넘겨 보기(기록·연결 없음)
    slide(0); $('follow').textContent = '👀 미리보기 — 수업에서는 학생 디벗에 "TV를 보세요" 대기 화면이 떠요';
    $('pv').style.display = 'flex'; $('pPrev').onclick = () => slide(page-1); $('pNext').onclick = () => slide(page+1);
    return;
  }
  wait('📡 선생님 화면을 기다리는 중…'); $('follow').textContent = '';
  try{
    if(!firebase.apps.length) firebase.initializeApp(EGUIDE.FB);
    firebase.auth().signInAnonymously().then(cred => {
      const db = firebase.database(), base = 'rooms/' + EGUIDE.room(classNo);
      const me = db.ref(base + '/viewers/' + cred.user.uid);
      db.ref('.info/connected').on('value', s => { if(s.val()){ me.onDisconnect().remove(); me.set({t: firebase.database.ServerValue.TIMESTAMP, r: round}); } });
      const T0 = Date.now();
      db.ref(base + '/guide').on('value', s => {
        const g = s.val() || {};
        if(qRound == null && g.round != null && +g.round !== round){ round = Math.max(0, Math.min(3, +g.round||0)); head(); me.update({r: round}); }
        if(+g.reset > T0){ try{ localStorage.removeItem('escape:/' + EGUIDE.ROUNDS[round].game.replace(/\.html$/,'')); }catch(e){} }   // [↺ 처음으로]: 하던 게임 기록 지우기
        if(g.round == null || +g.round !== round){ page = 0; wait('📡 선생님이 안내를 시작하면 여기에 표시돼요'); return; }
        page = Math.max(0, Math.min(EGUIDE.count(round)-1, +g.page || 0)); wait();
        if(g.go && Date.now() - (+g.go) < 3*3600e3){ wait('🚀 출발! 게임 화면으로 넘어가요…'); $('goBtn').style.display = 'block'; setTimeout(toGame, 800); }
      });
    }).catch(() => { wait('⚠️ 연결이 안 돼요. 앞 화면(TV)을 보고, 시작하면 아래 버튼을 누르세요.'); $('goBtn').style.display = 'block'; });
  }catch(e){ wait('⚠️ 연결이 안 돼요. 앞 화면(TV)을 보고, 시작하면 아래 버튼을 누르세요.'); $('goBtn').style.display = 'block'; }
})();
</script>
<script src="sdash.js"></script>
</body></html>

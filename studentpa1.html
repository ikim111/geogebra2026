<style>
  :root{

  *{box-sizing:border-box;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f6f8;margin:0;padding:0;color:#222;}
  .wrap{max-width:720px;margin:0 auto;padding:16px;}
  .progress-row{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .progress-bar{flex:1;height:10px;background:#e0e0e0;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--green);width:0%;transition:width .3s;}

  .task{background:#fff;border-radius:10px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden;}
  .task-head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px 8px;gap:10px;}
  .task-head h2{font-size:15px;margin:0;line-height:1.4;}
  .badge{flex:0 0 auto;font-size:12px;font-weight:bold;padding:4px 10px;border-radius:12px;white-space:nowrap;}
  .badge.pending{background:#eeeeee;color:#777;}
  .badge.done{background:#e8f5e9;color:var(--green);}
  .task-body{display:flex;flex-direction:column;}
  .scenario-box{margin:0 16px 12px;background:#eef4fc;border:1px solid #cfe0f5;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#0d3b6b;}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;}
  .toolbar button{font-size:12.5px;padding:6px 10px;border:1px solid #ccc;background:#fafafa;border-radius:6px;cursor:pointer;color:#333;}
  .toolbar button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .toolbar button.reset{margin-left:auto;background:#fff3e0;border-color:#ffcc80;color:#e65100;}
  .toolbar button.undo{background:#f3e5f5;border-color:#ce93d8;color:#6a1b9a;}
  .toolbar button.redo{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32;}
  .toolbar button.undo,.toolbar button.redo{font-size:15px;padding:5px 12px;}
  .canvas-wrap{padding:0 16px 14px;}
  svg.gcanvas{width:100%;max-width:600px;height:auto;border:1px solid #ddd;border-radius:6px;background:#fff;display:block;touch-action:none;cursor:crosshair;}
  .hint{font-size:12px;color:#888;padding:0 16px 12px;}
  .justify-row{padding:0 16px 12px;}
  .justify-row label{display:block;font-size:13.5px;font-weight:bold;color:#333;margin-bottom:6px;}
  .justify-row textarea{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;}
  .justify-row textarea:disabled{background:#f5f5f5;color:#555;}
  .choice-row{display:flex;gap:18px;}
  .choice-row label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:normal;margin:0;}
  .choice-row input[type=radio]{width:16px;height:16px;}
  .input-row{display:flex;gap:8px;padding:0 16px 14px;align-items:center;flex-wrap:wrap;}
  .input-row button{padding:9px 18px;border:none;background:var(--blue);color:#fff;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:bold;}
  .input-row button.cancel{background:#9e9e9e;}
  .feedback{font-size:13px;padding:0 16px 14px;font-weight:bold;}
  .feedback.ok{color:var(--green);}
  .feedback.no{color:var(--red);}
  .submit-panel{background:#fff;border-radius:10px;padding:18px 16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .submit-panel button.main{padding:12px 26px;font-size:15px;border:none;border-radius:8px;background:var(--green);color:#fff;cursor:pointer;font-weight:bold;}
  .submit-panel button.main.cancel{background:#9e9e9e;}
  .submit-panel button.backup{margin-top:10px;display:inline-block;padding:8px 16px;font-size:12.5px;border:1px solid #ccc;background:#fafafa;border-radius:6px;cursor:pointer;color:#555;}
  #submitStatus{margin-top:12px;font-size:13.5px;color:#333;}

  #syncStatus{font-size:12px;color:#999;margin-top:12px;}
  #syncStatus.on{color:var(--green);font-weight:bold;}
  #announceBanner{display:none;background:#fff8e1;border:1px solid #ffca28;color:#8d6e00;padding:10px 14px;border-radius:8px;margin:0 16px 14px;font-size:13.5px;align-items:center;justify-content:space-between;gap:10px;}
  #announceBanner button{border:none;background:transparent;color:#8d6e00;font-weight:bold;cursor:pointer;font-size:16px;}
  #lockOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:20px;}

  #stickyBar{position:sticky;top:0;z-index:400;background:#1A1D20;border-bottom:1px solid #000;padding:8px 16px 10px;display:flex;flex-direction:column;gap:6px;}

  #stickyBar #prevBtn:disabled{border-color:#3a3f44;color:#666;cursor:not-allowed;}
  #pageWrap{padding-top:14px;}

</style>

<script>
/* ============================================================
   수행평가: 삼각형의 외심과 내심 (studentpa1.html / teacherpa1.html 짝)
   - 이 파일은 student.html의 정식 "단원 목록"(SECTIONS)에는 올라가지 않습니다. 대신 선생님이
     teacherpa1.html에서 "시작"하면 student.html 목차 맨 위에 30분간(또는 선생님이 종료할
     때까지) 임시로 노출되는 별도 항목으로 뜹니다 — 자세한 내용은 student.html의 PA_TASKS 참고.
   - 반/번호/이름은 이 화면에서 직접 입력받습니다(1반~12반 버튼 + 번호/이름). 다른 단원의
     student.html과는 저장 위치(localStorage 키)가 분리되어 있어 서로 연동되지 않습니다.
   - 학생마다(반과 무관하게) "시작하기"를 처음 누르는 순간, 외심 시나리오 1개 + 내심 시나리오
     1개 + 등장 순서를 무작위로 딱 1번 확정해서 저장합니다(새로고침해도 그대로 유지).
   - 과제1·3(점 찍기)은 학생 화면에 정답 여부를 보여주지 않습니다("작성함"만 표시). 실제 정답
     여부는 저장된 도형을 바탕으로 teacherpa1.html이 계산해서 보여줍니다.
   - 과제2·4(서술형)의 ①번(외심/내심 선택) 정답 여부도 학생에게 보이지 않지만, 데이터에는
     expectedType으로 함께 저장되어 teacherpa1.html에서 바로 채점할 수 있습니다.

   Firebase 설정 안내: 기존 student0~6.html과 같은 Firebase 프로젝트를 그대로 재사용합니다.
   ACTIVITY_SUFFIX로 방(room) 경로를 이 활동 전용으로 분리했어요(teacherpa1.html과 반드시
   동일해야 합니다). 비워두면(FIREBASE_CONFIG.apiKey가 없으면) 실시간 저장 없이 이 기기의
   localStorage에만 임시로 저장됩니다.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBK7NlpKOr1ozAXF96vS8p7YyjiNaAJlfI',
  authDomain: 'brojuntest.firebaseapp.com',
  databaseURL: 'https://brojuntest-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'brojuntest',
  storageBucket: 'brojuntest.firebasestorage.app',
  messagingSenderId: '426333242398',
  appId: '1:426333242398:web:b3ae216d5269ce13065a0f'
};
const ACTIVITY_SUFFIX = '__assess_pa1'; // teacherpa1.html과 반드시 동일해야 함

const PREVIEW_PARAMS = new URLSearchParams(location.search);
const PREVIEW_MODE = PREVIEW_PARAMS.get('preview') === '1';

const GRID = 40;
const TOUCH_TOL = 30;
let _uid = 0;
const uid = () => 'o' + (_uid++);

/* ---------- 기하 수학 유틸 (기존 단원들과 동일한 엔진) ---------- */
const sub = (a,b) => ({x:a.x-b.x, y:a.y-b.y});
const add = (a,b) => ({x:a.x+b.x, y:a.y+b.y});
const norm = a => { const m = Math.hypot(a.x,a.y)||1; return {x:a.x/m,y:a.y/m}; };
const perp = a => ({x:-a.y, y:a.x});
const mid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const samePt = (a,b,tol=5) => a && b && dist(a,b) < tol;

function distToLine(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  return Math.abs((p.x-a.x)*dy - (p.y-a.y)*dx)/len;
}
function distToSegment(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
  let t = len2===0?0:((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function lineLineIntersection(a1,b1,a2,b2){
  const x1=a1.x,y1=a1.y,x2=b1.x,y2=b1.y,x3=a2.x,y3=a2.y,x4=b2.x,y4=b2.y;
  const d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
  if(Math.abs(d)<1e-9) return null;
  const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
  return {x:x1+t*(x2-x1), y:y1+t*(y2-y1)};
}
function circleLineIntersection(center,r,a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const fx=a.x-center.x, fy=a.y-center.y;
  const A=dx*dx+dy*dy, B=2*(fx*dx+fy*dy), C=fx*fx+fy*fy-r*r;
  let disc=B*B-4*A*C;
  if(disc<0) return [];
  disc=Math.sqrt(disc);
  const t1=(-B-disc)/(2*A), t2=(-B+disc)/(2*A);
  const pts=[];
  [t1,t2].forEach(t=>pts.push({x:a.x+t*dx, y:a.y+t*dy}));
  return pts;
}
function circleCircleIntersection(c1,r1,c2,r2){
  const d=dist(c1,c2);
  if(d>r1+r2||d<Math.abs(r1-r2)||d===0) return [];
  const a=(r1*r1-r2*r2+d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,r1*r1-a*a));
  const xm=c1.x+a*(c2.x-c1.x)/d, ym=c1.y+a*(c2.y-c1.y)/d;
  return [
    {x:xm+h*(c2.y-c1.y)/d, y:ym-h*(c2.x-c1.x)/d},
    {x:xm-h*(c2.y-c1.y)/d, y:ym+h*(c2.x-c1.x)/d}
  ];
}
function projectOntoLine(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy||1;
  const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
  return {x:a.x+t*dx, y:a.y+t*dy};
}
function projectOntoSegment(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy||1;
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  return {x:a.x+t*dx, y:a.y+t*dy};
}
function projectOntoCircle(p,center,r){
  const d=norm(sub(p,center));
  return {x:center.x+d.x*r, y:center.y+d.y*r};
}
function bisectorDir(a,b,c){
  const u=norm(sub(a,b)), v=norm(sub(c,b));
  let d=norm(add(u,v));
  if(Math.hypot(d.x,d.y)<1e-6) d=perp(norm(sub(c,a)));
  return d;
}
function arcInfo(b,a,c,r){
  const a1=Math.atan2(a.y-b.y,a.x-b.x), a2=Math.atan2(c.y-b.y,c.x-b.x);
  let diff=a2-a1;
  while(diff<=-Math.PI) diff+=2*Math.PI;
  while(diff>Math.PI) diff-=2*Math.PI;
  const end=a1+diff;
  const p1={x:b.x+r*Math.cos(a1), y:b.y+r*Math.sin(a1)};
  const p2={x:b.x+r*Math.cos(end), y:b.y+r*Math.sin(end)};
  const sweep = diff>0?1:0;
  return {path:`M ${p1.x} ${p1.y} A ${r} ${r} 0 0 ${sweep} ${p2.x} ${p2.y}`, deg: Math.abs(diff)*180/Math.PI, mid:{x:b.x+(r+16)*Math.cos(a1+diff/2), y:b.y+(r+16)*Math.sin(a1+diff/2)}};
}

/* ---------- 도구 메타 ---------- */
const TOOL_META = {
  move:{label:'이동'}, point:{label:'점'}, line:{label:'직선'}, segment:{label:'선분'},
  circleCP:{label:'원(중심,통과점)'}, circleCR:{label:'원(중심,반지름)'},
  perpBisector:{label:'수직이등분선'}, angleBisector:{label:'각의 이등분선'}, perp:{label:'수선'},
  intersect:{label:'교점'}, midpoint:{label:'중점'}, polygon:{label:'다각형'}, lengthTool:{label:'길이 재기'}, angleTool:{label:'각도 재기'}
};
const ALL_TOOLS = ['point','line','segment','circleCP','circleCR','intersect','midpoint','perp','perpBisector','angleBisector','polygon','lengthTool','angleTool'];
const INTERSECTABLE = ['line','segment','perpBisector','circleCP','circleCR','angleBisector','perp'];
const FREE_TOOLS = ALL_TOOLS;

/* ---------- GeoCanvas 클래스 (0~6단원과 같은 엔진) ---------- */
class GeoCanvas{
  constructor(svgEl, cfg, onChange){
    this.svg = svgEl;
    this.width = cfg.width || 600;
    this.height = cfg.height || 400;
    this.points = [];
    this.objects = [];
    this.history = [];
    this.tool = 'move';
    this.pending = [];
    this.pendingObjs = [];
    this.dragging = null;
    this.redoStack = [];
    this.onChange = onChange || (()=>{});
    this.backgroundSvg = cfg.background || null;
    this.labelPool = (cfg.labelPool || 'PQRSTUVWXYZLMNKJIHGFED').split('');
    (cfg.points||[]).forEach(p => this.addPoint(p.x,p.y,{label:p.label, locked: (p.locked!==undefined ? p.locked : true)}));
    (cfg.presetObjects||[]).forEach(o => {
      const resolved = Object.assign({}, o);
      ['p1','p2','center','through','r1','r2','a','b','c','p','refP1','refP2'].forEach(k=>{
        if(resolved[k] && typeof resolved[k]==='string'){ const pt=this.points.find(p=>p.label===resolved[k]); if(pt) resolved[k]=pt.id; }
      });
      if(resolved.ids) resolved.ids = resolved.ids.map(l=>{ const pt=this.points.find(p=>p.label===l); return pt?pt.id:l; });
      const obj = Object.assign({id:uid(), locked:true}, resolved);
      this.objects.push(obj);
    });
    this._wire();
    this.render();
  }
  addPoint(x,y,opts={}){
    const used = new Set(this.points.map(p=>p.label));
    const pool = this.labelPool;
    let label = opts.label;
    if(label && used.has(label)){
      let n=2; while(used.has(label+n)) n++;
      label = label+n;
    }
    if(!label) label = pool.find(l=>!used.has(l)) || ('X'+this.points.length);
    const p = {id:uid(), label, x, y, locked: !!opts.locked, constraint: opts.constraint||null, computed: opts.computed||null};
    this.points.push(p);
    if(!opts.locked || opts.trackHistory){ this.history.push({kind:'point', id:p.id}); this.redoStack=[]; }
    return p;
  }
  _recomputeComputedPoints(){
    this.points.forEach(p=>{
      if(!p.computed || p.computed.kind!=='intersection') return;
      const o1=this.objects.find(o=>o.id===p.computed.o1), o2=this.objects.find(o=>o.id===p.computed.o2);
      if(!o1||!o2) return;
      const pts=this.computeIntersections(o1,o2);
      if(!pts.length) return;

    this.redoStack=[];
    return obj;
  }

  getObjGeom(o){

      case 'circleCP': return {center:this.resolvePoint(o.center), through:this.resolvePoint(o.through)};
      case 'circleCR': return {center:this.resolvePoint(o.center), r1:this.resolvePoint(o.r1), r2:this.resolvePoint(o.r2)};
      case 'angleBisector': case 'angleLabel': return {a:this.resolvePoint(o.a), b:this.resolvePoint(o.b), c:this.resolvePoint(o.c)};
      case 'polygon': return {pts:o.ids.map(id=>this.resolvePoint(id))};
      case 'lengthLabel': return {p1:this.resolvePoint(o.p1), p2:this.resolvePoint(o.p2)};

  }
  undo(){

      const point = this.points.find(p=>p.id===last.id);
      const relatedObjects = this.objects.filter(o=>this._refsPoint(o,last.id));
      this.points = this.points.filter(p=>p.id!==last.id);
      this.objects = this.objects.filter(o=>!this._refsPoint(o,last.id));
      entry = {kind:'point', id:last.id, point, relatedObjects};
    } else {
      const object = this.objects.find(o=>o.id===last.id);
      this.objects = this.objects.filter(o=>o.id!==last.id);
      entry = {kind:'object', id:last.id, object};
    }
    this.redoStack.push(entry);
    this.pending=[]; this.pendingObjs=[];
    this.render();
  }
  redo(){
    const last = this.redoStack.pop();
    if(!last) return;
    if(last.kind==='point'){
      if(last.point) this.points.push(last.point);
      if(last.relatedObjects && last.relatedObjects.length) this.objects.push(...last.relatedObjects);
    } else if(last.object){
      this.objects.push(last.object);
    }
    this.history.push({kind:last.kind, id:last.id});
    this.pending=[]; this.pendingObjs=[];
    this.render();
  }
  _refsPoint(o,pid){
    return [o.p1,o.p2,o.center,o.through,o.r1,o.r2,o.a,o.b,o.c,o.p,o.refP1,o.refP2].includes(pid) || (o.ids && o.ids.includes(pid));
  }
  getSvgCoords(e){
    const pt = this.svg.createSVGPoint();
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    pt.x=t.clientX; pt.y=t.clientY;

    return {x:loc.x, y:loc.y};

  _wire(){

        if(p && !p.locked) this.dragging=p;

      }
      this.handleToolClick(pt);
    };
    const move = e=>{
      if(!this.dragging) return;

      if(this.dragging.constraint){
        const o=this.objects.find(ob=>ob.id===this.dragging.constraint.objId);
        if(o){ const proj=this._projectOntoObject(o,pt); nx=proj.x; ny=proj.y; }
      }
      this.dragging.x = Math.max(0,Math.min(this.width,nx));
      this.dragging.y = Math.max(0,Math.min(this.height,ny));
      this.render();
    };
    const up = ()=>{ this.dragging=null; };
    this.svg.addEventListener('mousedown', down);
    this.svg.addEventListener('touchstart', down, {passive:false});
    window.addEventListener('mousemove', move);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('mouseup', up);
    window.addEventListener('touchend', up);
  }
  handleToolClick(pt){

        if(o){ const proj=this._projectOntoObject(o,pt); this.addPoint(proj.x,proj.y,{constraint:{objId:o.id}}); }
        else { this.addPoint(pt.x,pt.y); }

      }
      case 'line': case 'segment': {

        break;
      }
      case 'circleCP': {
        const p=this.pickPoint(pt); this.pending.push(p.id);
        if(this.pending.length>=2){ const [c,t]=this.pending; if(c!==t) this.addObject({type:'circleCP',center:c,through:t}); this.pending=[]; }
        break;
      }
      case 'circleCR': {
        if(this.pending.length===0){
          const p=this.pickPoint(pt); this.pending.push(p.id);
          break;
        }
        const segObj=this.findObjectNear(pt,TOUCH_TOL);
        if(segObj && segObj.type==='segment'){
          const cId=this.pending[0]; this.pending=[];
          this.addObject({type:'circleCR', center:cId, r1:segObj.p1, r2:segObj.p2});
          break;
        }
        const p=this.pickPoint(pt); this.pending.push(p.id);
        if(this.pending.length>=3){ const [c,r1,r2]=this.pending; this.addObject({type:'circleCR',center:c,r1,r2}); this.pending=[]; }
        break;
      }
      case 'perpBisector': {
        if(this.pending.length===0){
          const segObj=this.findObjectNear(pt,TOUCH_TOL);
          if(segObj && (segObj.type==='segment'||segObj.type==='line')){
            this.addObject({type:'perpBisector', p1:segObj.p1, p2:segObj.p2});
            break;
          }
        }
        const p=this.pickPoint(pt); this.pending.push(p.id);
        if(this.pending.length>=2){ const [a,b]=this.pending; this.addObject({type:'perpBisector',p1:a,p2:b}); this.pending=[]; }
        break;
      }
      case 'angleBisector': {

          }
        }
        const p=this.pickPoint(pt); this.pending.push(p.id);
        if(this.pending.length>=2){ const [a,b]=this.pending; this.addObject({type:'lengthLabel',p1:a,p2:b}); this.pending=[]; }
        break;
      }
      case 'angleTool': {
        const p=this.pickPoint(pt); this.pending.push(p.id);

  }
  render(){

      this.svg.appendChild(bgG);
    }
    const g0=document.createElementNS(NS,'g');
    for(let x=0;x<=this.width;x+=GRID){
      const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',x); l.setAttribute('y1',0); l.setAttribute('x2',x); l.setAttribute('y2',this.height);
      l.setAttribute('stroke','#f0f0f0'); g0.appendChild(l);
    }
    for(let y=0;y<=this.height;y+=GRID){
      const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',0); l.setAttribute('y1',y); l.setAttribute('x2',this.width); l.setAttribute('y2',y);
      l.setAttribute('stroke','#f0f0f0'); g0.appendChild(l);
    }
    this.svg.appendChild(g0);

    const extend=(origin,dir,len=1000)=>({x1:origin.x-dir.x*len,y1:origin.y-dir.y*len,x2:origin.x+dir.x*len,y2:origin.y+dir.y*len});

      const l=document.createElementNS(NS,'line');
      l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
      l.setAttribute('stroke',color); l.setAttribute('stroke-width',2);
      if(dash) l.setAttribute('stroke-dasharray',dash);
      this.svg.appendChild(l);
    };

    this.objects.forEach(o=>{
      const g=this.getObjGeom(o);

      if(o.type==='line'){ const e=extend(g.p1,norm(sub(g.p2,g.p1))); mkLine(e.x1,e.y1,e.x2,e.y2,'#1565c0'); }
      else if(o.type==='segment'){ mkLine(g.p1.x,g.p1.y,g.p2.x,g.p2.y, o.color||'#1565c0', o.dash); }

        mkLine(e.x1,e.y1,e.x2,e.y2,'#00838f');

      else if(o.type==='circleCP'||o.type==='circleCR'){

        const el=document.createElementNS(NS,'circle');
        el.setAttribute('cx',c.center.x); el.setAttribute('cy',c.center.y); el.setAttribute('r',Math.max(c.r,0.1));

        el.setAttribute('points',pts); el.setAttribute('fill','#1565c0'); el.setAttribute('fill-opacity','0.12');
        el.setAttribute('stroke','#1565c0'); el.setAttribute('stroke-width','2');

        const m=mid(g.p1,g.p2);
        const t=document.createElementNS(NS,'text');
        t.setAttribute('x',m.x); t.setAttribute('y',m.y-8); t.setAttribute('fill','#c62828');
        t.setAttribute('font-size','14'); t.setAttribute('font-weight','bold'); t.setAttribute('text-anchor','middle');

      }
      else if(o.type==='angleLabel'){
        const info=arcInfo(g.b,g.a,g.c,28);
        const path=document.createElementNS(NS,'path');
        path.setAttribute('d',info.path); path.setAttribute('stroke','#c62828'); path.setAttribute('fill','none'); path.setAttribute('stroke-width','2');
        this.svg.appendChild(path);
        const t=document.createElementNS(NS,'text');
        t.setAttribute('x',info.mid.x); t.setAttribute('y',info.mid.y); t.setAttribute('fill','#c62828');
        t.setAttribute('font-size','13'); t.setAttribute('font-weight','bold'); t.setAttribute('text-anchor','middle');
        t.textContent=info.deg.toFixed(1)+'°';
        this.svg.appendChild(t);
      }
    });

    [...this.pending].forEach(id=>{
      const p=this.resolvePoint(id); if(!p) return;
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',10);
      c.setAttribute('fill','none'); c.setAttribute('stroke','#fbc02d'); c.setAttribute('stroke-width','3');
      this.svg.appendChild(c);
    });

    this.points.forEach(p=>{
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',5);
      c.setAttribute('fill', p.locked ? '#212121' : '#0277bd');
      c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.5');
      this.svg.appendChild(c);
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',p.x+9); t.setAttribute('y',p.y-8);
      t.setAttribute('font-size','14'); t.setAttribute('font-weight','bold'); t.setAttribute('fill','#222');
      t.textContent=p.label;
      this.svg.appendChild(t);
    });

    this.onChange(this);
  }
}

function restoreObjectSnapshot(cv, snapshot){
  if(!cv || !snapshot) return;
  const remap = {};
  (snapshot.points||[]).forEach(sp=>{
    let target = cv.points.find(p=>p.label===sp.label);
    if(target){ target.x=sp.x; target.y=sp.y; }
    else { target = cv.addPoint(sp.x, sp.y, {label:sp.label}); }
    remap[sp.id] = target.id;
  });
  const keys=['p1','p2','center','through','r1','r2','a','b','c','p','refP1','refP2'];
  (snapshot.objects||[]).forEach(so=>{
    const obj = {type:so.type};
    keys.forEach(k=>{ if(so[k]!=null) obj[k] = (remap[so[k]]!==undefined) ? remap[so[k]] : so[k]; });
    if(so.ids) obj.ids = so.ids.map(id=> remap[id]!==undefined ? remap[id] : id);
    cv.addObject(obj);
  });
  cv.render();
}

function randomAssignment(){
  return {
    circumIdx: Math.floor(Math.random()*CIRCUM_SCENARIOS.length),
    incenterIdx: Math.floor(Math.random()*INCENTER_SCENARIOS.length),
    circumFirst: Math.random()<0.5
  };
}
/* 반(class) 번호로 ver1~4를 결정한다: 4로 나눈 나머지가 1이면 ver1, 2면 ver2, 3이면 ver3, 0이면 ver4.
   (예: 1,5,9반 -> ver1 / 2,6,10반 -> ver2 / 3,7,11반 -> ver3 / 4,8,12반 -> ver4) */
function assignmentForRoom(room){
  const n = parseInt(room, 10);
  let idx = 0;
  if(Number.isFinite(n)){
    const r = ((n % 4) + 4) % 4;
    idx = (r === 0) ? 3 : (r - 1);
  }
  return { circumIdx: idx, incenterIdx: idx, circumFirst: true };
}
function buildTasks(a){
  const circumS = CIRCUM_SCENARIOS[a.circumIdx] || CIRCUM_SCENARIOS[0];
  const incenterS = INCENTER_SCENARIOS[a.incenterIdx] || INCENTER_SCENARIOS[0];
  const firstIsCircum = !!a.circumFirst;
  const first = firstIsCircum ? {centerType:'외심', scenario:circumS} : {centerType:'내심', scenario:incenterS};
  const second = firstIsCircum ? {centerType:'내심', scenario:incenterS} : {centerType:'외심', scenario:circumS};
  return [
    {id:1, kind:'pointplot', centerType:first.centerType, scenario:first.scenario, title:`[과제 1] ${first.scenario.title} — 점 찍기`},
    {id:2, kind:'justify', centerType:first.centerType, scenario:first.scenario, title:`[과제 2] ${first.scenario.title} — 생각 정리하기`},
    {id:3, kind:'pointplot', centerType:second.centerType, scenario:second.scenario, title:`[과제 3] ${second.scenario.title} — 점 찍기`},
    {id:4, kind:'justify', centerType:second.centerType, scenario:second.scenario, title:`[과제 4] ${second.scenario.title} — 생각 정리하기`}
  ];
}

/* ---------- localStorage 오프라인 대체(Firebase 미설정/연결 실패 시) ---------- */
const ASSIGN_KEY = 'ggb_assign_pa1_v1';
function loadLocalAssignment(){
  try{
    const raw=localStorage.getItem(ASSIGN_KEY);
    if(!raw) return null;
    const obj=JSON.parse(raw);
    if(obj && typeof obj.circumIdx==='number' && typeof obj.incenterIdx==='number' && typeof obj.circumFirst==='boolean') return obj;
  }catch(e){}
  return null;
}
function saveLocalAssignment(a){ try{ localStorage.setItem(ASSIGN_KEY, JSON.stringify(a)); }catch(e){} }
function getOrCreateLocalAssignment(room){
  const a = assignmentForRoom(room);
  saveLocalAssignment(a);
  return a;
}

/* 서버(Firebase) 연결이 안 될 때도 진행 내용/제출 여부를 이 기기에 항상 남겨두어,
   나중에 연결이 되면 자동으로 서버에 올려 보내기 위한 안전장치. */
const WORK_KEY = 'ggb_work_pa1_v1';
function workIdentity(name, room, number){
  return RT.sanitize(room)+'|'+RT.sanitize(number)+'|'+RT.sanitize(name);
}
function loadLocalWork(){
  try{
    const raw = localStorage.getItem(WORK_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveLocalWork(identity, partial){
  try{
    let cur = loadLocalWork();
    if(!cur || cur.identity !== identity) cur = {identity};
    const merged = Object.assign({}, cur, partial, {identity});
    localStorage.setItem(WORK_KEY, JSON.stringify(merged));
  }catch(e){}
}
function saveLocalObjSnapshot(identity, taskId, snap){
  try{
    let cur = loadLocalWork();
    if(!cur || cur.identity !== identity) cur = {identity};
    const snaps = Object.assign({}, cur.objectSnapshots||{});
    snaps[taskId] = snap;
    saveLocalWork(identity, {objectSnapshots: snaps});
  }catch(e){}
}

function buildToolbar(task, cv, toolsEl){
  const mkBtn=(id,label,cls)=>{ const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls; b.id=id; return b; };
  const moveBtn=mkBtn(`tool-move-${task.id}`,'이동'); moveBtn.classList.add('active');
  toolsEl.appendChild(moveBtn);
  const buttons={move:moveBtn};
  FREE_TOOLS.forEach(t=>{
    const b=mkBtn(`tool-${t}-${task.id}`, TOOL_META[t].label);
    toolsEl.appendChild(b); buttons[t]=b;
    b.addEventListener('click', ()=>{ cv.setTool(t); Object.values(buttons).forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  });
  moveBtn.addEventListener('click', ()=>{ cv.setTool('move'); Object.values(buttons).forEach(x=>x.classList.remove('active')); moveBtn.classList.add('active'); });
  const undoBtn=mkBtn(`undo-${task.id}`,'↩️','undo'); undoBtn.title='되돌리기'; undoBtn.addEventListener('click',()=>cv.undo());
  const redoBtn=mkBtn(`redo-${task.id}`,'↪️','redo'); redoBtn.title='다시하기'; redoBtn.addEventListener('click',()=>cv.redo());
  const resetBtn=mkBtn(`reset-${task.id}`,'초기화','reset'); resetBtn.addEventListener('click',()=>cv.reset());
  toolsEl.appendChild(undoBtn); toolsEl.appendChild(redoBtn); toolsEl.appendChild(resetBtn);
  return buttons;
}

/* 과제1·3(점 찍기): 학생 화면에는 정답 여부를 보여주지 않는다. "작성함"은 그저 학생이
   기존 A/B/C 세 점 외에 뭔가를 그려봤는지만 나타낸다. 실제 정답 판정은 저장된 도형
   스냅샷을 바탕으로 teacherpa1.html이 계산한다. */
function initPointPlotTask(task){
  buildTaskCard(task);
  const svg=document.getElementById(`svg-${task.id}`);
  const toolsEl=document.getElementById(`tools-${task.id}`);
  const badge=document.getElementById(`badge-${task.id}`);
  const labelPool = task.centerType==='외심' ? 'OPQRSTUVWXYZLMNKJIHGFED' : 'IPQRSTUVWXYZLMNKJHGFED';
  const triangleSides = [
    {type:'segment', p1:'A', p2:'B', color:'#333', locked:true},
    {type:'segment', p1:'B', p2:'C', color:'#333', locked:true},
    {type:'segment', p1:'C', p2:'A', color:'#333', locked:true}
  ];
  const cv = new GeoCanvas(svg, {points: task.scenario.points, labelPool, background: scenarioBackground(task.scenario.key), presetObjects: triangleSides}, (inst)=>onChange(inst));
  canvasByTaskId[task.id] = cv;
  buildToolbar(task, cv, toolsEl);

  function attempted(inst){
    return inst.points.some(p=>!p.locked) || inst.objects.some(o=>!o.locked);
  }
  function onChange(inst){
    const done = attempted(inst);
    results[task.id] = {done};
    badge.textContent = done ? '작성함' : '작성 전';
    badge.className = 'badge ' + (done ? 'done' : 'pending');
    updateProgress();
    RT.pushObjectsDebounced(task.id, inst);
  }
  onChange(cv);
}

function initJustifyTask(task){
  buildTaskCard(task);
  const badge=document.getElementById(`badge-${task.id}`);
  const fb=document.getElementById(`fb-${task.id}`);
  const reasonEl=document.getElementById(`reason-${task.id}`);
  const methodEl=document.getElementById(`method-${task.id}`);
  const btn=document.getElementById(`check-${task.id}`);
  const radios=document.getElementsByName(`choice-${task.id}`);
  const MIN=15;
  let locked=false;

  function getChoice(){ for(const r of radios) if(r.checked) return r.value; return null; }
  function ready(){ return !!getChoice() && (reasonEl.value||'').trim().length>=MIN && (methodEl.value||'').trim().length>=MIN; }
  function refresh(){
    if(locked) return;
    if(ready()){ fb.textContent='준비됐어요! "제출" 버튼을 눌러보세요.'; fb.className='feedback ok'; }
    else{ fb.textContent=`①번을 선택하고, ②③번을 각각 ${MIN}자 이상 적어주세요.`; fb.className='feedback no'; }
  }
  function currentValue(){ return {choice:getChoice(), reason:reasonEl.value, method:methodEl.value, expectedType:task.centerType}; }
  function doSubmit(){
    if(!ready()){ refresh(); return; }
    locked=true;
    Array.from(radios).forEach(r=>r.disabled=true);
    reasonEl.disabled=true; methodEl.disabled=true;
    btn.textContent='취소'; btn.classList.add('cancel');
    results[task.id] = {done:true, value: currentValue()};
    badge.textContent='완료'; badge.className='badge done';
    fb.textContent='제출을 완료했어요! "취소"를 누르면 다시 고칠 수 있어요.';
    fb.className='feedback ok';
    updateProgress();
  }
  function doCancel(){
    locked=false;
    Array.from(radios).forEach(r=>r.disabled=false);
    reasonEl.disabled=false; methodEl.disabled=false;
    btn.textContent='제출'; btn.classList.remove('cancel');
    results[task.id] = {done:false, value: currentValue()};
    updateProgress();
    refresh();
  }
  btn.addEventListener('click', ()=> locked?doCancel():doSubmit());
  reasonEl.addEventListener('input', refresh);
  methodEl.addEventListener('input', refresh);
  Array.from(radios).forEach(r=>r.addEventListener('change', refresh));
  results[task.id] = {done:false, value: currentValue()};
  refresh();
}

function updateProgress(){
  const total = TASKS.length || 4;
  const done = TASKS.filter(t=>results[t.id] && results[t.id].done).length;
  document.getElementById('progressText').textContent = `완료 ${done} / ${total}`;
  document.getElementById('progressFill').style.width = (total? done/total*100 : 0)+'%';
  RT.pushProgressDebounced(done, total);
}

function restoreProgress(progress){
  if(!progress) return;
  TASKS.forEach(t=>{
    const p = progress[t.id];
    if(!p || !p.done) return;
    results[t.id] = { done:true, value: p.value };
    const badge=document.getElementById(`badge-${t.id}`);
    if(t.kind==='pointplot'){
      if(badge){ badge.textContent='작성함'; badge.className='badge done'; }
    } else {
      if(badge){ badge.textContent='완료'; badge.className='badge done'; }
      const v = p.value || {};
      const reasonEl=document.getElementById(`reason-${t.id}`);
      const methodEl=document.getElementById(`method-${t.id}`);
      const radios=document.getElementsByName(`choice-${t.id}`);
      if(reasonEl){ reasonEl.value=v.reason||''; reasonEl.disabled=true; }
      if(methodEl){ methodEl.value=v.method||''; methodEl.disabled=true; }
      Array.from(radios).forEach(r=>{ r.checked = (r.value===v.choice); r.disabled=true; });
      const btn=document.getElementById(`check-${t.id}`);
      if(btn){ btn.disabled=true; btn.classList.add('locked-fixed'); btn.textContent='제출됨'; }
      const fb=document.getElementById(`fb-${t.id}`);
      if(fb){ fb.textContent='이전에 제출한 내용이에요.'; fb.className='feedback ok'; }
    }
  });
  updateProgress();
}

function renderTasks(assignment){
  TASKS = buildTasks(assignment);
  container.textContent='';
  TASKS.forEach(t=>{
    try{
      if(t.kind==='pointplot') initPointPlotTask(t);
      else initJustifyTask(t);
    }catch(err){
      const box=document.createElement('div');
      box.style.cssText='background:#ffebee;color:#b71c1c;border:2px solid #e57373;padding:10px;margin:10px 16px;border-radius:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;';
      box.textContent = `[디버그] 과제 ${t.id} 처리 중 오류: ${err.message}\n${err.stack||''}`;
      container.appendChild(box);
      console.error('Task', t.id, err);
    }
  });
  pages = [...document.querySelectorAll('#taskContainer > .task'), document.querySelector('.submit-panel')];
  currentPage = 0;
  showPage(0);
}

/* ---------- 페이지 넘기기 ---------- */
function pageTaskNum(idx){
  const p = pages[idx];
  if(!p) return null;
  const n = parseInt(p.dataset.taskId, 10);
  return isNaN(n) ? null : n;
}
function taskIdToPageIdx(n){ return pages.findIndex(p=> parseInt(p.dataset.taskId,10)===n); }
function showPage(idx){
  currentPage = Math.max(0, Math.min(pages.length-1, idx));
  pages.forEach((p,i)=>{ p.style.display = (i===currentPage) ? '' : 'none'; });
  const label=document.getElementById('pageLabel');
  if(label) label.textContent = `${currentPage+1} / ${pages.length}`;
  RT.setViewingTask(pageTaskNum(currentPage));
  window.scrollTo(0,0);
  updateNavButtons();
}
function applyPauseLock(paused){
  document.body.classList.toggle('app-paused', paused);
  document.querySelectorAll('.toolbar button, .input-row input, .input-row textarea, .input-row button, .justify-row textarea, .choice-row input').forEach(el=>{
    el.disabled = paused || el.classList.contains('locked-fixed');
  });
  if(typeof updateNavButtons==='function') updateNavButtons();
}
function clampToPacing(){
  if(RT.minTaskId==null && RT.maxTaskId==null) return;
  const curNum = pageTaskNum(currentPage);
  if(curNum==null) return;
  if(RT.maxTaskId!=null && curNum > RT.maxTaskId){
    const idx = taskIdToPageIdx(RT.maxTaskId);
    if(idx>=0){ showPage(idx); return; }
  }
  if(RT.minTaskId!=null && curNum < RT.minTaskId){
    const idx = taskIdToPageIdx(RT.minTaskId);
    if(idx>=0){ showPage(idx); }
  }
}
function updateNavButtons(){
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const pacingMsg=document.getElementById('pacingMsg');
  if(!prevBtn||!nextBtn) return;
  const isFirst = currentPage===0;
  const isLast = currentPage===pages.length-1;
  const nextNum = pageTaskNum(currentPage+1);
  const prevNum = pageTaskNum(currentPage-1);
  const blockedNext = !isLast && RT.maxTaskId!=null && nextNum!=null && nextNum > RT.maxTaskId;
  const blockedPrev = !isFirst && RT.minTaskId!=null && prevNum!=null && prevNum < RT.minTaskId;
  prevBtn.disabled = isFirst || blockedPrev || RT.paused;
  nextBtn.disabled = isLast || blockedNext || RT.paused;
  if(pacingMsg){
    if(RT.minTaskId!=null && RT.maxTaskId!=null){
      pacingMsg.textContent = `⏸ 선생님이 ${RT.minTaskId}~${RT.maxTaskId}번 화면만 진행하도록 설정했어요.`;
    } else if(RT.maxTaskId!=null){
      pacingMsg.textContent = `⏸ 선생님이 ${RT.maxTaskId}번까지만 진행하도록 설정했어요.`;
    } else if(RT.minTaskId!=null){
      pacingMsg.textContent = `⏸ 선생님이 ${RT.minTaskId}번부터 진행하도록 설정했어요.`;
    }
    pacingMsg.style.display = (blockedNext || blockedPrev) ? 'block' : 'none';
  }
}
document.getElementById('prevBtn').addEventListener('click', ()=> showPage(currentPage-1));
document.getElementById('nextBtn').addEventListener('click', ()=> showPage(currentPage+1));
function goToResumePage(){
  for(let i=0;i<pages.length;i++){
    const n = pageTaskNum(i);
    if(n!=null && (!results[n] || !results[n].done)){ showPage(i); return; }
  }
  showPage(pages.length-1);
}

/* ---------- 실시간 확인(Firebase) ---------- */
const RT = {
  app:null, db:null, roomRef:null, studentRef:null, controlRef:null,
  connected:false, studentKey:null, lastSeenAnnounceTs:0, viewingTaskId:null, heartbeatTimer:null,
  minTaskId:null, maxTaskId:null, paused:false, visitedTasks:new Set(),
  classEnded:false, _lastKnownClassEnded:null,

  sanitize(s){ return (s||'').trim().replace(/[.#$\[\]\/\s]+/g,'_').slice(0,30) || 'x'; },
  connect(name, room, number, onReady){
    this._lastArgs = {name, room, number, onReady};
    this.identity = workIdentity(name, room, number);
    const statusEl=document.getElementById('syncStatus');
    if(!FIREBASE_CONFIG.apiKey){
      statusEl.textContent = '⚠️ 실시간 저장이 설정되지 않아, 이 기기에만 임시로 저장돼요.';
      onReady(getOrCreateLocalAssignment(room), null);
      return;
    }
    try{
      if(!this.app){
        this.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
        this.db = firebase.database();
      }
      statusEl.textContent = '🔄 로그인 중...';
      firebase.auth().signInAnonymously()
        .then(cred => this._afterAuth(cred.user.uid, name, room, number, statusEl, onReady))
        .catch(err => {
          statusEl.textContent = '⚠️ 로그인 실패: ' + err.message + ' (이 기기에만 임시로 저장돼요)';
          onReady(getOrCreateLocalAssignment(room), null);
        });
    }catch(err){
      if(/firebase/i.test(err.message)){
        statusEl.textContent = '⚠️ 인터넷 연결 문제로 서버에 연결하지 못했어요. 이 기기에만 임시로 저장돼요.';
      } else {
        statusEl.textContent = '⚠️ 연결 실패: ' + err.message;
      }
      onReady(getOrCreateLocalAssignment(room), null);
    }
  },
  _afterAuth(uid, name, room, number, statusEl, onReady){
    const roomKey = this.sanitize(room) + ACTIVITY_SUFFIX;
    const key = this.sanitize(number) + '_' + this.sanitize(name);
    this.studentKey = key;
    this.roomRef = this.db.ref('rooms/'+roomKey);
    this.studentRef = this.roomRef.child('students/'+key);
    this.controlRef = this.roomRef.child('control');

    this.studentRef.once('value').then(snap=>{
      let existing = snap.val();
      let assignment = existing && existing.assignment;
      if(!assignment){
        assignment = assignmentForRoom(room);
        this.studentRef.child('assignment').set(assignment);
      }
      /* 이전에 서버 연결이 안 돼서 이 기기에만 임시 저장돼 있던 진행 내용이 있으면,
         서버에는 아직 아무 기록이 없을 때 지금 자동으로 서버에 올려서 복구한다. */
      const localWork = loadLocalWork();
      if(localWork && localWork.identity===this.identity && (localWork.progress||localWork.objectSnapshots||localWork.submitted)
         && (!existing || (!existing.progress && !existing.objectSnapshots))){
        const upd = {};
        if(localWork.progress) upd.progress = localWork.progress;
        if(localWork.submitted){ upd.submitted = true; upd.submittedAt = firebase.database.ServerValue.TIMESTAMP; }
        if(Object.keys(upd).length) this.studentRef.update(upd);
        if(localWork.objectSnapshots){
          Object.keys(localWork.objectSnapshots).forEach(tid=>{
            this.studentRef.child('objectSnapshots/'+tid).set(localWork.objectSnapshots[tid]);
          });
        }
        existing = Object.assign({}, existing, {
          progress: localWork.progress || (existing && existing.progress),
          objectSnapshots: localWork.objectSnapshots || (existing && existing.objectSnapshots),
          submitted: (existing && existing.submitted) || !!localWork.submitted
        });
      }
      this.studentRef.update({
        name: name,
        number: number || null,
        joinedAt: (existing && existing.joinedAt) ? existing.joinedAt : firebase.database.ServerValue.TIMESTAMP,
        lastActive: firebase.database.ServerValue.TIMESTAMP,
        online: true
      });
      this.connected = true;
      statusEl.textContent = `🟢 실시간 연결됨 (${room}반)`;
      statusEl.className = 'on';
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = setInterval(()=>{
        if(this.connected) this.studentRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP, online:true });
      }, 15000);
      onReady(assignment, existing);
    }).catch(()=>{
      onReady(getOrCreateLocalAssignment(room), null);
    });

    this.studentRef.onDisconnect().update({ online:false, lastActive: firebase.database.ServerValue.TIMESTAMP });

    this.controlRef.on('value', snap=>{
      const c = snap.val() || {};
      this.paused = !!c.paused;
      document.getElementById('lockOverlay').style.display = this.paused ? 'flex' : 'none';
      applyPauseLock(this.paused);
      if(c.announcement && c.announcementTs && c.announcementTs > this.lastSeenAnnounceTs){
        this.lastSeenAnnounceTs = c.announcementTs;
        document.getElementById('announceText').textContent = c.announcement;
        document.getElementById('announceBanner').style.display = 'flex';
      } else if(!c.announcement){
        document.getElementById('announceBanner').style.display = 'none';
      }
      this.minTaskId = (c.minTaskId!=null) ? c.minTaskId : null;
      this.maxTaskId = (c.maxTaskId!=null) ? c.maxTaskId : null;
      if(typeof clampToPacing==='function') clampToPacing();
      if(typeof updateNavButtons==='function') updateNavButtons();

      const classEnded = !!c.classEnded;
      if(this._lastKnownClassEnded===null){
        if(classEnded && typeof applyFinalLock==='function') applyFinalLock(true);
      } else if(classEnded !== this._lastKnownClassEnded){
        if(typeof applyFinalLock==='function') applyFinalLock(classEnded);
      }
      this._lastKnownClassEnded = classEnded;
      this.classEnded = classEnded;
    });
  },
  pushProgress(done, total){
    const progress = {};
    TASKS.forEach(t=>{
      const r = results[t.id];
      progress[t.id] = { done: !!(r&&r.done), value: (r&&r.value!==undefined) ? r.value : null, visited: this.visitedTasks.has(t.id) };
    });
    if(this.identity) saveLocalWork(this.identity, {progress, completed: done, total});
    if(!this.connected) return;
    this.studentRef.update({
      progress, completed: done, total,
      currentTaskId: this.viewingTaskId,
      lastActive: firebase.database.ServerValue.TIMESTAMP
    });
  },
  pushProgressDebounced(done, total){
    clearTimeout(this._progressTimer);
    this._progressTimer = setTimeout(()=>{ this._progressTimer=null; this.pushProgress(done, total); }, 150);
  },
  _objTimers: {},
  _writeObjSnapshot(taskId, cv){
    const keys=['p1','p2','center','through','r1','r2','a','b','c','ids','p','refP1','refP2'];
    const snap = {
      taskId,
      points: cv.points.map(p=>({id:p.id, x:Math.round(p.x), y:Math.round(p.y), label:p.label, locked:!!p.locked})),
      objects: cv.objects.map(o=>{
        const out={id:o.id, type:o.type, locked:!!o.locked};
        keys.forEach(k=>{ if(o[k]!=null) out[k]=o[k]; });
        return out;
      }),
      ts: this.connected ? firebase.database.ServerValue.TIMESTAMP : Date.now()
    };
    if(this.identity) saveLocalObjSnapshot(this.identity, taskId, snap);
    if(!this.connected) return;
    this.studentRef.child('objectSnapshots/'+taskId).set(snap);
  },
  pushObjectsDebounced(taskId, cv){
    if(!cv) return;
    clearTimeout(this._objTimers[taskId]);
    this._objTimers[taskId] = setTimeout(()=>{ this._objTimers[taskId]=null; this._writeObjSnapshot(taskId, cv); }, 150);
  },
  flushPending(){
    if(this._progressTimer){
      clearTimeout(this._progressTimer);
      this._progressTimer=null;
      const total = TASKS.length;
      const done = TASKS.filter(t=>results[t.id] && results[t.id].done).length;
      this.pushProgress(done, total);
    }
    Object.keys(this._objTimers).forEach(taskId=>{
      if(this._objTimers[taskId]){
        clearTimeout(this._objTimers[taskId]);
        this._objTimers[taskId]=null;
        const cv = canvasByTaskId[taskId];
        if(cv) this._writeObjSnapshot(taskId, cv);
      }
    });
  },
  setViewingTask(taskId){
    if(taskId!=null) this.visitedTasks.add(taskId);
    if(this.viewingTaskId===taskId) return;
    this.viewingTaskId = taskId;
    if(this.connected){
      this.studentRef.update({ currentTaskId: taskId, lastActive: firebase.database.ServerValue.TIMESTAMP });
      const total = TASKS.length;
      const done = TASKS.filter(t=>results[t.id] && results[t.id].done).length;
      this.pushProgress(done, total);
      if(taskId!=null && canvasByTaskId[taskId]) this.pushObjectsDebounced(taskId, canvasByTaskId[taskId]);
    }
  }
};

function flushBeforeLeaving(){ if(RT.connected && typeof RT.flushPending==='function') RT.flushPending(); }
window.addEventListener('pagehide', flushBeforeLeaving);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushBeforeLeaving(); });

document.getElementById('announceClose').addEventListener('click', ()=>{
  document.getElementById('announceBanner').style.display='none';
});

/* ---------- 반/번호/이름: 이 수행평가 전용 저장(다른 단원 student.html과 연동되지 않음) ---------- */
const PROFILE_KEY = 'ggb_profile_pa1_local_v1';
function loadProfileFromUrl(){
  const p = new URLSearchParams(location.search);
  const classNo=(p.get('classNo')||'').trim();
  const number=(p.get('number')||'').trim();
  const name=(p.get('name')||'').trim();
  if(classNo && name) return {classNo, number, name};
  return null;
}
function loadProfile(){
  const fromUrl = loadProfileFromUrl();
  if(fromUrl){
    try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({...fromUrl, ts:Date.now()})); }catch(e){}
    return fromUrl;
  }
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.classNo && obj.name) ? obj : null;
  }catch(e){ return null; }
}
function saveProfile(classNo, number, name){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify({classNo, number, name, ts:Date.now()})); }catch(e){}
}

const IDENTITY_KEY = 'ggb_identity_pa1_v1';
function saveIdentity(name, room, number){ try{ localStorage.setItem(IDENTITY_KEY, JSON.stringify({name, room, number, ts:Date.now()})); }catch(e){} }
function loadIdentity(){
  try{
    const raw = localStorage.getItem(IDENTITY_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return (obj && obj.name) ? obj : null;
  }catch(e){ return null; }
}

function startApp(name, room, number){
  saveIdentity(name, room, number);
  document.getElementById('gateScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  container.innerHTML = '<div style="text-align:center;color:#888;padding:50px 16px;">불러오는 중...</div>';
  RT.connect(name, room, number, (assignment, existing)=>{
    renderTasks(assignment);
    if(existing){
      if(existing.progress){
        Object.keys(existing.progress).forEach(id=>{
          if(existing.progress[id] && existing.progress[id].visited) RT.visitedTasks.add(parseInt(id,10));
        });
        restoreProgress(existing.progress);
        goToResumePage();
      }
      if(existing.objectSnapshots){
        Object.keys(existing.objectSnapshots).forEach(tid=>{
          const cv = canvasByTaskId[tid];
          if(cv) restoreObjectSnapshot(cv, existing.objectSnapshots[tid]);
        });
      }
      if(existing.submitted && typeof applyFinalLock==='function'){ applyFinalLock(true); }
    }
  });
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  const name = document.getElementById('studentName').value.trim();
  const room = document.getElementById('roomCode').value.trim();
  const number = document.getElementById('studentNumber').value.trim();
  const statusEl = document.getElementById('syncStatus');
  if(!name || !room || !number){ statusEl.textContent = '번호가 빠져있어요. 아래 "정보 수정"을 눌러 번호를 입력해주세요.'; return; }
  startApp(name, room, number);
});
(function(){

  const hidden=document.getElementById('manualClass');
  for(let i=1;i<=12;i++){
    const b=document.createElement('button');
    b.type='button'; b.textContent=i+'반'; b.dataset.room=String(i);
    b.addEventListener('click', ()=>{
      hidden.value = String(i);
      grid.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');

    grid.appendChild(b);
  }
})();
document.getElementById('manualStartBtn').addEventListener('click', ()=>{
  const classNo = document.getElementById('manualClass').value.trim();
  const number = document.getElementById('manualNumber').value.trim();
  const name = document.getElementById('manualName').value.trim();
  const statusEl = document.getElementById('syncStatus');
  if(!classNo || !number || !name){ statusEl.textContent = '반, 번호, 이름을 모두 입력해주세요.'; return; }
  saveProfile(classNo, number, name);

  document.getElementById('studentName').value = name;

document.getElementById('switchUserBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  try{ localStorage.removeItem(IDENTITY_KEY); }catch(err){}
  location.reload();
});
document.getElementById('profileEditBtn').addEventListener('click', (e)=>{
  e.preventDefault();
  const profile = loadProfile();
  document.getElementById('profileManualBox').style.display = 'block';
  document.getElementById('profileBox').style.display = 'none';
  if(profile){
    document.getElementById('manualNumber').value = profile.number || '';
    document.getElementById('manualName').value = profile.name || '';
    const grid = document.getElementById('manualClassGrid');
    const hidden = document.getElementById('manualClass');
    if(grid && profile.classNo){
      hidden.value = String(profile.classNo);
      grid.querySelectorAll('button').forEach(b=>{
        b.classList.toggle('selected', b.dataset.room===String(profile.classNo));
      });
    }
  }
});

if(PREVIEW_MODE){
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('previewBanner').style.display = 'flex';
  document.getElementById('previewCloseBtn').addEventListener('click', ()=>{
    window.close();
    setTimeout(()=>{
      if(!window.closed) location.href = 'teacherpa1.html';
    }, 250);
  });
  const pp = PREVIEW_PARAMS;
  const a = {
    circumIdx: parseInt(pp.get('circum'),10) || 0,
    incenterIdx: parseInt(pp.get('incenter'),10) || 0,
    circumFirst: pp.get('order') !== 'incenter'
  };
  renderTasks(a);
} else {
  const profile = loadProfile();
  if(!profile){
    document.getElementById('profileManualBox').style.display = 'block';
    document.getElementById('profileBox').style.display = 'none';
  } else {
    document.getElementById('roomCode').value = profile.classNo;
    document.getElementById('studentName').value = profile.name;
    document.getElementById('studentNumber').value = profile.number || '';
    document.getElementById('profileClassView').textContent = profile.classNo + '반';
    document.getElementById('profileNumberView').textContent = (profile.number || '-') + '번';
    document.getElementById('profileNameView').textContent = profile.name;
    document.getElementById('profileManualBox').style.display = 'none';
    document.getElementById('profileBox').style.display = 'block';

    const id = loadIdentity();
    if(id && id.room===profile.classNo && id.name===profile.name){
      startApp(id.name, id.room, id.number);
      document.getElementById('switchUserName').textContent = id.name;
      document.getElementById('switchUserWrap').style.display = 'block';
    }
  }
}

/* ---------- 제출 / 백업 ---------- */
function buildPayload(){
  const name=document.getElementById('studentName').value.trim();
  const room=document.getElementById('roomCode').value.trim();
  const number=document.getElementById('studentNumber').value.trim();
  const list = TASKS.map(t=>({id:t.id, title:t.title, kind:t.kind, centerType:t.centerType, scenario:t.scenario.title, done: results[t.id]? !!results[t.id].done : false, value: results[t.id]?results[t.id].value:undefined}));
  const completed=list.filter(r=>r.done).length;
  return {room, number, name, submittedAt:new Date().toISOString(), completed, total:list.length, results:list};
}
function downloadBackup(payload){
  const blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`수행평가_외심내심_${payload.name||'무명'}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
let finalLocked = false;
function applyFinalLock(locked){
  finalLocked = locked;
  document.body.classList.toggle('final-locked', locked);
  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('submitStatus');
  btn.textContent = locked ? '제출 취소' : '결과 제출하기';
  btn.classList.toggle('cancel', locked);
  statusEl.textContent = locked
    ? '✅ 제출 완료! 더 이상 내용을 수정할 수 없어요. "제출 취소"를 누르면 다시 고칠 수 있어요.'
    : '';
}
document.getElementById('submitBtn').addEventListener('click', ()=>{
  const name=document.getElementById('studentName').value.trim();
  if(!name){ alert('이름을 입력해주세요.'); return; }
  if(finalLocked){
    if(RT.classEnded){
      alert('선생님이 수업을 종료했어요. 선생님이 "수업 시작"을 눌러야 다시 수정할 수 있어요.');
      return;
    }
    applyFinalLock(false);
    if(RT.identity) saveLocalWork(RT.identity, {submitted:false});
    if(RT.connected) RT.studentRef.update({ submitted:false, submittedAt:null });
  } else {
    applyFinalLock(true);
    if(RT.identity) saveLocalWork(RT.identity, {submitted:true});
    if(RT.connected) RT.studentRef.update({ submitted:true, submittedAt: firebase.database.ServerValue.TIMESTAMP });
  }
});
document.getElementById('backupBtn').addEventListener('click', ()=>{
  downloadBackup(buildPayload());
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사용 — 단원 선택</title>
<style>
  :root{ --blue:#1565c0; --green:#2e7d32; --gray:#616161; }
  *{box-sizing:border-box;}
  body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f6f8;margin:0;padding:0;color:#222;}
  header{background:#1a237e;color:#fff;padding:22px 16px;text-align:center;}
  header h1{margin:0 0 4px;font-size:21px;}
  header p{margin:0;font-size:13px;opacity:.85;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px;}
  .unit-list{display:flex;flex-direction:column;gap:10px;}
  .unit-link{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:16px 18px;text-decoration:none;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .1s, box-shadow .1s;}
  .unit-link:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .unit-link .num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;}
  .unit-link .title{font-size:15px;font-weight:bold;}
  .unit-link .arrow{margin-left:auto;color:#bbb;font-size:18px;}
</style>
</head>
<body>

<header>
  <h1>📊 교사용 대시보드 — 단원 선택</h1>
  <p>확인할 단원을 선택하면 해당 단원의 실시간 대시보드로 이동합니다</p>
</header>

<div class="wrap">
  <div class="unit-list" id="unitList"></div>
</div>

<script>
const BASE_URL = 'https://geogebra2026.netlify.app/';
const UNITS = [
  {n:0, title:'지오지브라 연습', file:'teacher0.html'},
  {n:1, title:'이등변삼각형의 성질', file:'teacher1.html'},
  {n:2, title:'수직이등분선의 성질', file:'teacher2.html'},
  {n:3, title:'각이등분선의 성질', file:'teacher3.html'},
  {n:4, title:'삼각형의 외심', file:'teacher4.html'},
  {n:5, title:'삼각형의 내심', file:'teacher5.html'},
  {n:6, title:'생각 넓히기', file:'teacher6.html'}
];

const list=document.getElementById('unitList');
UNITS.forEach(u=>{
  const a=document.createElement('a');
  a.className='unit-link';
  a.href = BASE_URL + u.file;
  const num=document.createElement('span'); num.className='num'; num.textContent=u.n;
  const title=document.createElement('span'); title.className='title'; title.textContent=u.title;
  const arrow=document.createElement('span'); arrow.className='arrow'; arrow.textContent='›';
  a.appendChild(num); a.appendChild(title); a.appendChild(arrow);
  list.appendChild(a);
});
</script>
</body>
</html>

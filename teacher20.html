const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

function normalize(v){
  v = v || {};
  const roster = (Array.isArray(v.roster) ? v.roster : Object.values(v.roster||{})).filter(Boolean).map(x=>{ const o = {no:+x.no||0, name:String(x.name||''), score:+x.score||0, mentor:!!x.mentor}; if(x.tie) o.tie = true; if(x.exam!=null) o.exam = +x.exam; return o; });
  const teams = (Array.isArray(v.teams) ? v.teams : Object.values(v.teams||{})).filter(t=>t && t.m!=null).map(t=>({m:+t.m, e:(Array.isArray(t.e)?t.e:Object.values(t.e||{})).map(Number)}));
  const seats = {}; Object.entries(v.seats||{}).forEach(([k,s])=>{ if(!s || !s.g) return;
    if(s.s==='L' || s.s==='R') seats[k] = {g:+s.g, s:s.s, top: s.top!=null ? +s.top : null, bot: s.bot!=null ? +s.bot : null};
    else { const tm = teams.find(t=>t.m===+k) || {e:[]}; seats[k] = tm.e.length>=2 ? {g:+s.g, s:'L', top:tm.e[1], bot:tm.e[0]} : {g:+s.g, s:(+s.r?'R':'L'), top:null, bot:tm.e[0]!=null?tm.e[0]:null}; } // 예전 형식 변환
  });
  return { roster, teams, seats, mode: v.mode==='pair' || v.mode==='seat' ? v.mode : '' };
}
/* 12등 동점자: 아직 정하지 않은 동점자(tie)가 있으면 짝 정하기를 막는다 */
const tiePending = () => S.roster.filter(x=>x.tie);
/* 차례: 발표 점수 많은 순, 같으면 명단 순서 */
function order(){ return S.roster.map((x,i)=>Object.assign({i}, x)).filter(x=>x.no).sort((a,b)=> b.score-a.score || a.i-b.i); }
const byNo = no => S.roster.find(x=>x.no===no);
const nm = no => { const x = byNo(no); return x ? `${x.no} ${x.name}` : `${no}번`; };
function teamOf(no){ return S.teams.find(t=> t.m===no || t.e.includes(no)); }
function rankMap(){ const m = {}; order().forEach((x,k)=> m[x.no]=k); return m; }
const HUES = [0,30,55,95,140,175,200,225,260,290,320,345,15,110,240];
function teamColor(t){ const k = S.teams.indexOf(t); return `hsl(${HUES[k%HUES.length]} 70% 55%)`; }

/* ---------- 저장/불러오기 ---------- */
function save(){
  if(!ref){ $('saveState').textContent = '⚠️ 저장 안 됨(연결 실패)'; return; }
  $('saveState').textContent = '저장 중…';
  ref.set({ roster:S.roster, teams:S.teams, seats:S.seats, mode:S.mode||'', ts: Date.now() })
    .then(()=> $('saveState').textContent = '✔ 저장됨')
    .catch(()=> $('saveState').textContent = '⚠️ 저장 실패');
}
function commit(fn, noRender){ undoStack.push(clone(S)); if(undoStack.length>50) undoStack.shift(); fn(); save(); if(!noRender) render(); }
function undo(){ if(!undoStack.length) return; S = undoStack.pop(); pairSel = {mentor:null, mentees:[]}; save(); render(); }

function loadRoom(r){
  room = r; undoStack = []; pairSel = {mentor:null, mentees:[]}; seatPick = null;
  history.replaceState(null, '', '?classNo='+encodeURIComponent(room));
  $('homeLink').href = 'mgmt-9x3k7f2p.html?classNo='+encodeURIComponent(room);
  document.querySelectorAll('#classTabs button').forEach(b=> b.classList.toggle('on', b.dataset.c===room));
  if(ref) ref.off();
  S = { roster:[], teams:[], seats:{} }; render();
  if(!db){ S = normalize(DEFAULTS[room]); render(); return; }
  ref = db.ref('rooms/'+room+SUFFIX);
  let first = true;
  ref.on('value', snap=>{
    const v = snap.val();
    if(first && !v && DEFAULTS[room]){ first = false; S = normalize(DEFAULTS[room]); save(); render(); return; }
    first = false;
    const nv = normalize(v);
    if(JSON.stringify(nv) === JSON.stringify(normalize(S))) return; // 방금 내가 저장한 것 — 다시 그리지 않는다(입력 중인 칸 유지)
    S = nv; render();
  }, ()=>{ $('saveState').textContent = '⚠️ 불러오기 실패'; });
}

// 엑셀처럼 머리글(번호·발표·멘토)을 누르면 정렬, 한 번 더 누르면 반대 방향
let rosterSort = {k:'no', dir:1};
const SORT_FIRST = {no:1, score:-1, mentor:1}; // 처음 누를 때: 번호 오름차순, 발표 많은 순, 멘토 먼저
function rosterView(){
  const list = S.roster.map((x,i)=>({x,i})), d = rosterSort.dir;
  const byNo = (a,b)=> (a.x.no||999)-(b.x.no||999) || a.i-b.i;
  if(rosterSort.k==='score') return list.sort((a,b)=> d*((a.x.score||0)-(b.x.score||0)) || a.i-b.i);
  if(rosterSort.k==='mentor'){ const g = x => x.mentor ? 0 : (x.tie ? 1 : 2); return list.sort((a,b)=> d*(g(a.x)-g(b.x)) || byNo(a,b)); }
  return list.sort((a,b)=> d*byNo(a,b));
}
function sortTh(k, label){
  const on = rosterSort.k===k;
  const arrow = on ? (rosterSort.dir>0?'▲':'▼') : '⇅';
  return `<th class="sth ${on?'on':''}" data-rsort="${k}" title="눌러서 정렬 (한 번 더 누르면 반대로)">${label}<span class="arr">${arrow}</span></th>`;
}

    <table class="roster"><tr><th>차례</th>${sortTh('no','번호')}<th>이름</th>${sortTh('score','발표')}${sortTh('mentor','멘토')}${S.roster.some(x=>x.exam!=null)?'<th>시험(참고)</th>':''}<th></th></tr>`;

    <p class="hint">명단(번호·이름)은 이미 들어 있어요. 발표 점수만 넣으면 돼요. 방법 3가지 중 편한 것을 쓰세요.</p>
    <ol class="hint" style="margin:4px 0 8px;padding-left:20px;"><li>위 표의 <b>발표</b> 칸에 바로 입력 (Enter나 Tab을 누르면 다음 학생 칸으로)</li><li>시트·엑셀에서 <b>번호와 발표</b>(또는 번호·이름·발표) 칸을 복사해 아래에 붙여 넣기</li><li>엑셀 파일(.xlsx·.csv) 올리기 — 번호와 발표 점수가 있는 표면 돼요</li></ol>

  $('t-roster').innerHTML = h;
  if(active){ const el = document.querySelector(`[data-ri="${active[0]}"][data-f="${active[1]}"]`); if(el){ el.focus(); } }

document.addEventListener('change', e=>{
  const el = e.target; if(el.dataset.ri==null) return;
  const i = +el.dataset.ri, f = el.dataset.f;

document.addEventListener('keydown', e=>{
  const el = e.target; if(!el.dataset || el.dataset.f!=='score' || (e.key!=='Enter' && e.key!=='Tab')) return;
  e.preventDefault();

  const all = [...document.querySelectorAll('table.roster [data-f="score"]')], next = all[all.indexOf(el) + (e.shiftKey?-1:1)];
  el.dispatchEvent(new Event('change', {bubbles:true}));

});
/* 발표 점수 넣기: "번호 발표" 또는 "번호 이름 발표"가 이어진 글에서 번호로 찾아 점수만 바꾼다 */
function parseScores(text){
  const toks = String(text).split(/[\s,]+/).filter(Boolean), out = [];
  const isInt = t => /^\d+$/.test(t), isNum = t => /^-?\d+(\.\d+)?$/.test(t);
  for(let k=0;k<toks.length;){
    if(isInt(toks[k]) && toks[k+1]!=null && !isNum(toks[k+1]) && toks[k+2]!=null && isNum(toks[k+2])){ out.push({no:+toks[k], name:toks[k+1], score:+toks[k+2]}); k+=3; }
    else if(isInt(toks[k]) && toks[k+1]!=null && isNum(toks[k+1])){ out.push({no:+toks[k], score:+toks[k+1]}); k+=2; }
    else k++;
  }
  return out;
}
function applyScoreList(list, msgEl){
  if(!list.length){ msgEl.textContent = '번호와 발표 점수를 찾지 못했어요.'; return; }
  let ok = 0; const miss = [], diff = [];
  commit(()=>{ list.forEach(it=>{ const x = S.roster.find(y=>y.no===it.no); if(!x){ miss.push(it.no); return; } if(it.name && x.name && it.name!==x.name) diff.push(`${it.no}번(${x.name}≠${it.name})`); x.score = it.score; ok++; }); });
  const m = document.getElementById('scoreMsg') || msgEl;
  m.textContent = `✔ ${ok}명 점수를 넣었어요.` + (miss.length ? ` 명단에 없는 번호: ${miss.join(', ')}.` : '') + (diff.length ? ` 이름이 다른 번호: ${diff.join(', ')} (점수는 번호 기준으로 넣었어요).` : '');
}
document.addEventListener('change', e=>{
  if(e.target.id!=='xlsxFile' || !e.target.files.length) return;
  const f = e.target.files[0], rd = new FileReader();
  rd.onload = ()=>{
    try{
      if(typeof XLSX==='undefined') throw new Error('엑셀 기능을 불러오지 못했어요');
      const wb = XLSX.read(new Uint8Array(rd.result), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true});
      applyScoreList(parseScores(rows.map(r=> (r||[]).map(c=> c==null?'':String(c).replace(/\s+/g,'')).join('\t')).join('\n')), document.getElementById('scoreMsg'));
    }catch(err){ document.getElementById('scoreMsg').textContent = '파일을 읽지 못했어요: ' + (err.message||err); }
  };
  rd.readAsArrayBuffer(f); e.target.value = '';
});
document.addEventListener('click', e=>{
  const t = e.target.closest ? e.target.closest('button') : null; if(!t) return;

    commit(()=>{ S.roster.splice(+t.dataset.del,1); S.teams = S.teams.filter(tm=>tm.m!==x.no).map(tm=>({m:tm.m, e:tm.e.filter(n=>n!==x.no)})); delete S.seats[x.no]; }); return; }
  if(t.id==='addRow'){ commit(()=> S.roster.push({no:0,name:'',score:0,mentor:false})); return; }
  if(t.id==='resetDefault'){ if(!confirm('처음 받은 명단과 멘토로 되돌릴까요? 짝과 자리도 모두 지워져요.')) return; commit(()=>{ S = normalize(DEFAULTS[room]); }); return; }
  if(t.id==='clearAll'){ if(!confirm('명단과 짝·자리를 모두 지울까요?')) return; commit(()=>{ S = {roster:[],teams:[],seats:{}}; }); return; }
  if(t.id==='applyPaste'){
    const toks = $('pasteBox').value.split(/[\s,]+/).filter(Boolean), list = [];
    for(let k=0;k+2<toks.length;){ if(/^\d+$/.test(toks[k]) && !/^\d+$/.test(toks[k+1]) && /^-?\d+(\.\d+)?$/.test(toks[k+2])){ list.push({no:+toks[k], name:toks[k+1], score:+toks[k+2], mentor:false}); k+=3; } else k++; }
    if(!list.length){ alert('번호·이름·발표 순서로 된 줄을 찾지 못했어요.'); return; }
    if(!confirm(`${list.length}명으로 명단을 바꿀까요? 짝과 자리는 지워져요.`)) return;
    commit(()=>{ S = {roster:list, teams:[], seats:{}}; }); $('pasteBox').value=''; return;
  }
  if(t.id==='applyMentors'){ const ns = $('mentorList').value.split(/[^\d]+/).filter(Boolean).map(Number); commit(()=> S.roster.forEach(x=> x.mentor = ns.includes(x.no))); return; }
});

/* ② 짝 정하기 */
function currentTurn(){
  if(pairPick!=null){ const x = order().find(y=>y.no===pairPick); if(x && !teamOf(x.no)) return x; pairPick = null; }
  return order().find(x=> !teamOf(x.no)) || null;
}
function renderPair(){
  const o = order(), cur = currentTurn();
  if(cur && pairSel.mentor===null && pairSel.mentees.length===0) pairSel.cur = cur.no;
  let list = o.map((x,k)=>{ const tm = teamOf(x.no); return `<div class="it ${tm?'done':''} ${cur&&cur.no===x.no?'cur':''}" ${tm?'':`data-pp="${x.no}" style="cursor:pointer;" title="눌러서 이 학생이 먼저 고르기"`}><span class="rk">${k+1}</span><span class="badge ${x.mentor?'m':'e'}">${x.mentor?'멘토':'멘티'}</span><span class="nm">${esc(x.no+' '+x.name)}${tm?' ✓':''}</span><span class="sc">${x.score}</span></div>`; }).join('');
  let main = '';
  if(!S.roster.length) main = `<div class="notice">먼저 ① 명단을 넣어 주세요.</div>`;
  else if(tiePending().length) main = `<div class="notice">⚠️ 12등 동점자(${tiePending().map(x=>esc(x.no+' '+x.name)).join(', ')}) 중 멘토 1명을 ① 명단 화면에서 먼저 골라 주세요.</div>`;
  else if(!cur) main = `<div class="ok-msg">🎉 모든 학생의 짝(팀)이 정해졌어요. ③ 자리 고르기로 넘어가요.</div>`;
  else {
    const freeMentees = o.filter(x=> !x.mentor && !teamOf(x.no) && x.no!==cur.no);
    // 아직 팀이 없는 다른 멘토도 멘티를 1명은 가질 수 있게 남겨 둔다
    const freeMentors = o.filter(x=> x.mentor && !teamOf(x.no) && x.no!==cur.no);
    if(cur.mentor){
      const threes = S.teams.filter(t=>t.e.length>=2).length; // 3명 팀은 모둠 왼쪽 묶음에만 앉으므로 최대 6팀
      const maxPick = threes>=6 ? 1 : Math.max(1, Math.min(2, freeMentees.length - freeMentors.length));
      main = `<div class="turn"><div class="who">지금 차례: ${esc(cur.no+' '+cur.name)} <span class="badge m">멘토</span> <span style="font-size:15px;color:#666;">발표 ${cur.score}</span></div>
        <div class="what">함께할 <b>멘티를 1명 또는 2명</b> 골라요.</div>
        <div class="lbl">남은 멘티</div><div class="cands">${freeMentees.map(x=>`<button class="cand ${pairSel.mentees.includes(x.no)?'sel':''}" data-pe="${x.no}" ${!pairSel.mentees.includes(x.no)&&pairSel.mentees.length>=maxPick?'disabled':''}>${esc(x.no+' '+x.name)}<small>${x.score}</small></button>`).join('') || '<span class="hint">남은 멘티가 없어요. 아래 팀 목록에서 조정해 주세요.</span>'}</div>
        ${maxPick<2 && freeMentees.length ? `<p class="hint">${threes>=6 ? '3명 팀이 벌써 6팀(모둠마다 1팀)이라' : `팀이 없는 다른 멘토 ${freeMentors.length}명도 멘티가 있어야 해서`} 지금은 <b>1명</b>만 고를 수 있어요.</p>` : ''}
        <div class="row" style="margin-top:10px;"><button class="btn primary" id="pairOk" ${pairSel.mentees.length?'':'disabled'}>✅ 확정 (${pairSel.mentees.map(nm).join(', ')||'멘티를 골라요'})</button>${pairPick!=null ? `<button class="btn" id="pairPickReset">↩ 원래 순서로</button>` : ''}</div></div>`;
    } else {
      // 남은 멘티가 팀 없는 멘토 수보다 적으면, 이 학생은 팀 없는 멘토만 고를 수 있다
      const mustNew = freeMentees.length < freeMentors.length;
      const full3 = S.teams.filter(t=>t.e.length>=2).length >= 6;
      const mentorsOpen = o.filter(x=> x.mentor && (()=>{ const tm = teamOf(x.no); return mustNew ? !tm : (!tm || (tm.e.length<1 || (tm.e.length<2 && !full3))); })());
      const tmSel = pairSel.mentor!=null ? teamOf(pairSel.mentor) : null;
      const leftMentors = freeMentors.length - (pairSel.mentor!=null && !tmSel ? 1 : 0);
      const threes2 = S.teams.filter(t=>t.e.length>=2).length;
      const room2 = pairSel.mentor!=null ? Math.min(2 - (tmSel ? tmSel.e.length : 0) - 1, freeMentees.length - leftMentors, threes2>=6 ? 0 : 1) : 0;
      main = `<div class="turn"><div class="who">지금 차례: ${esc(cur.no+' '+cur.name)} <span class="badge e">멘티</span> <span style="font-size:15px;color:#666;">발표 ${cur.score}</span></div>
        <div class="what"><b>멘토 1명</b>을 골라요. 원하면 함께할 <b>멘티 1명</b>을 더 고를 수 있어요(한 팀은 최대 3명).</div>
        <div class="lbl">멘토 (자리가 남은 멘토만)</div><div class="cands">${mentorsOpen.map(x=>{ const tm = teamOf(x.no); return `<button class="cand m ${pairSel.mentor===x.no?'sel':''}" data-pm="${x.no}">${esc(x.no+' '+x.name)}<small>${tm?'멘티 '+tm.e.map(n=>byNo(n)?byNo(n).name:n).join('·'):'비어 있음'}</small></button>`; }).join('') || '<span class="hint">자리가 남은 멘토가 없어요. 아래 팀 목록에서 직접 넣어 주세요.</span>'}</div>
        <div class="lbl">함께할 멘티 (선택)</div><div class="cands">${freeMentees.map(x=>`<button class="cand ${pairSel.mentees.includes(x.no)?'sel':''}" data-pe="${x.no}" ${(pairSel.mentor==null || (room2<1 && !pairSel.mentees.includes(x.no)) || (!pairSel.mentees.includes(x.no) && pairSel.mentees.length>=1))?'disabled':''}>${esc(x.no+' '+x.name)}<small>${x.score}</small></button>`).join('') || '<span class="hint">남은 멘티가 없어요.</span>'}</div>
        ${mustNew ? '<p class="hint">팀이 없는 멘토가 남아 있어서, 아직 팀이 없는 멘토만 고를 수 있어요.</p>' : ''}
        ${pairSel.mentor!=null && room2<1 ? `<p class="hint">${tmSel && tmSel.e.length>=1 ? '이 멘토의 팀은 이미 2명이라 멘티를 더 고를 수 없어요.' : '팀이 없는 다른 멘토도 멘티가 있어야 해서 멘티를 더 고를 수 없어요.'}</p>` : ''}
        <div class="row" style="margin-top:10px;"><button class="btn primary" id="pairOk" ${pairSel.mentor!=null?'':'disabled'}>✅ 확정</button>${pairPick!=null ? `<button class="btn" id="pairPickReset">↩ 원래 순서로</button>` : ''}</div></div>`;
    }
  }
  main += `<div class="row no-print" style="margin:10px 0;"><button class="btn" id="undoBtn" ${undoStack.length?'':'disabled'}>↶ 되돌리기</button><button class="btn danger" id="resetPairs">짝 모두 지우기</button></div>`;
  main += `<div class="panel" style="margin-top:6px;"><h2>팀 ${S.teams.length}개 <span style="font-size:12.5px;color:#888;font-weight:normal;">— ×로 빼기, 아래 선택으로 멘티 직접 넣기</span></h2><div class="teams">${S.teams.map(t=>{
      const free = o.filter(x=>!x.mentor && !teamOf(x.no));
      return `<div class="team" style="--c:${teamColor(t)}"><div class="hd"><span>${t.e.length+1}명</span></div><span class="chip m">${esc(nm(t.m))}<button data-rmt="${t.m}" title="팀 지우기">×</button></span>${t.e.map(n=>`<span class="chip">${esc(nm(n))}<button data-rme="${t.m}:${n}" title="빼기">×</button></span>`).join('')}
        ${t.e.length<2 && free.length ? `<br><select data-addto="${t.m}"><option value="">＋ 멘티 넣기</option>${free.map(x=>`<option value="${x.no}">${esc(x.no+' '+x.name)}</option>`).join('')}</select>` : ''}</div>`; }).join('') || '<span class="hint">아직 정해진 팀이 없어요.</span>'}</div></div>`;
  $('t-pair').innerHTML = `<div class="pair-wrap"><div class="panel order"><h2>차례 (발표 많은 순)</h2><p class="hint" style="margin:-4px 0 6px;">학생을 누르면 그 학생이 먼저 골라요.</p>${list}</div><div>${main}</div></div>`;
}
/* 차례 목록에서 학생을 누르면 그 학생이 먼저 고른다(결석·순서 바꾸기) */
document.addEventListener('click', e=>{ if(tab!=='pair') return; const it = e.target.closest && e.target.closest('[data-pp]'); if(!it) return; pairPick = +it.dataset.pp; pairSel = {mentor:null, mentees:[]}; renderPair(); });
document.addEventListener('click', e=>{
  const t = e.target.closest ? e.target.closest('button') : null; if(!t || tab!=='pair') return;
  const cur = currentTurn();
  if(t.dataset.pe){ const n = +t.dataset.pe; const i = pairSel.mentees.indexOf(n); if(i>=0) pairSel.mentees.splice(i,1); else pairSel.mentees.push(n); renderPair(); return; }
  if(t.dataset.pm){ const n = +t.dataset.pm; pairSel.mentor = pairSel.mentor===n ? null : n; pairSel.mentees = []; renderPair(); return; }
  if(t.id==='pairOk' && cur && !tiePending().length){
    commit(()=>{
      if(cur.mentor){ S.teams.push({m:cur.no, e:pairSel.mentees.slice(0,2)}); }
      else { let tm = teamOf(pairSel.mentor); if(!tm){ tm = {m:pairSel.mentor, e:[]}; S.teams.push(tm); } tm.e.push(cur.no, ...pairSel.mentees.slice(0,1)); tm.e = tm.e.slice(0,2); }
      pairSel = {mentor:null, mentees:[]};
    }); pairPick = null; renderPair(); return;
  }
  if(t.id==='pairPickReset'){ pairPick = null; pairSel = {mentor:null, mentees:[]}; renderPair(); return; }
  if(t.dataset.rmt){ const m = +t.dataset.rmt; if(!confirm(`${nm(m)} 팀을 지울까요? (팀의 멘티도 다시 고를 수 있게 돼요)`)) return; commit(()=>{ S.teams = S.teams.filter(x=>x.m!==m); delete S.seats[m]; }); return; }
  if(t.dataset.rme){ const [m,n] = t.dataset.rme.split(':').map(Number); commit(()=>{ const tm = teamOf(m); tm.e = tm.e.filter(x=>x!==n); }); return; }
  if(t.id==='resetPairs'){ if(!confirm('짝(팀)과 자리를 모두 지울까요?')) return; commit(()=>{ S.teams=[]; S.seats={}; }); pairSel={mentor:null,mentees:[]}; return; }
  if(t.id==='undoBtn'){ undo(); return; }
});
document.addEventListener('change', e=>{
  const el = e.target; if(!el.dataset || !el.dataset.addto || !el.value) return;
  const m = +el.dataset.addto, n = +el.value;
  commit(()=>{ const tm = teamOf(m); if(tm && tm.e.length<2 && !teamOf(n)) tm.e.push(n); });
});

/* ③ 자리 고르기
   모둠 = 세로 묶음 2개.   [ 1 ]            1·2·4 = 왼쪽 묶음(멘토 2, 멘티 1·4) — 3명 팀만 1번까지 씀, 2명 팀은 2·4(1번은 빈자리)
                         [ 2 ][ 3 ]        3·5   = 오른쪽 묶음(멘토 5, 멘티 3) — 2명 팀만
                         [ 4 ][ 5 ]        노랑(2·5) = 멘토 자리, 흰색(1·3·4) = 멘티 자리
   S.seats[멘토번호] = {g:모둠, s:'L'|'R', top:1번 멘티(L·3명 팀만), bot:4번 또는 3번 멘티} */
const GROUPS_TOP = [6,5,4], GROUPS_BOTTOM = [3,2,1];
let pendingL = null; // 3명 팀이 왼쪽 묶음을 골랐을 때 자리판에 미리 보여 주는 중 {g, top, bot} — 멘티 위·아래를 바꾼 뒤 확정
function teamOrder(){ const rk = rankMap(); return S.teams.slice().sort((a,b)=> Math.min(rk[a.m], ...a.e.map(n=>rk[n])) - Math.min(rk[b.m], ...b.e.map(n=>rk[n]))); }
function setAt(g, side){ const k = Object.keys(S.seats).find(m=> S.seats[m].g===g && S.seats[m].s===side); return k!=null ? S.teams.find(t=>t.m===+k) : null; }
function curSeatTeam(){ if(seatPick!=null){ const t = S.teams.find(x=>x.m===seatPick); if(t && !S.seats[t.m]) return t; seatPick = null; } return teamOrder().find(t=> !S.seats[t.m]) || null; }
/* 2명 팀이 왼쪽 묶음을 너무 많이 차지하면 뒤 차례 3명 팀이 앉을 곳이 없어지므로 막는다 */
function leftReserved(t){ const freeL = [1,2,3,4,5,6].filter(g=>!setAt(g,'L')).length; const need3 = S.teams.filter(x=> x!==t && x.e.length>=2 && !S.seats[x.m]).length; return freeL <= need3; }
function canSit(t, g, side){ if(!t || setAt(g,side)) return false; if(side==='R' && t.e.length>=2) return false; if(side==='L' && t.e.length<2 && leftReserved(t)) return false; return true; }
function whyNot(t, g, side){ if(setAt(g,side)) return '이미 찬 자리'; if(side==='R' && t && t.e.length>=2) return '3명 팀은 왼쪽 묶음(멘티 위·아래 자리)만 앉을 수 있어요'; if(side==='L' && t && t.e.length<2 && leftReserved(t)) return '남은 왼쪽 묶음은 아직 자리를 고르지 않은 3명 팀 몫이에요. 오른쪽 묶음을 골라요.'; return ''; }
function cell(no, cls, t, g, side, opts){
  const x = no!=null ? byNo(no) : null, it = opts && opts.interactive;
  const st = it ? (setAt(g,side) ? 'ok' : (canSit(opts.cur,g,side) ? 'ok' : 'no')) : '';
  const tip = it ? (setAt(g,side) ? (side==='L' && S.seats[setAt(g,side).m].top!=null && cls!=='mseat' ? '멘티 자리는 모둠 제목줄의 [멘티 자리 바꾸기]로 바꿔요. 비우려면 노란 자리를 눌러요' : '누르면 이 묶음을 비울 수 있어요') : (opts.cur ? (canSit(opts.cur,g,side) ? '여기에 앉기' : whyNot(opts.cur,g,side)) : '')) : '';
  return `<div class="seat ${cls} ${x?'filled':''} ${st}" style="${t?`--c:${teamColor(t)}`:''}" ${it?`data-g="${g}" data-s="${side}" title="${tip}"`:''}>${x ? esc(x.name)+`<small>${x.no}번</small>` : ''}</div>`;
}
function pvCell(no, cls, t, g, swap){ // 미리보기 칸(흐리게 깜박임). 멘티 칸은 누르면 위·아래가 서로 바뀐다
  const x = byNo(no);
  return `<div class="seat ${cls} preview ${swap?'swap':''}" style="--c:${teamColor(t)}" >${x ? esc(x.name)+`<small>${x.no}번</small>` : ''}</div>`;
}
function groupHTML(g, opts){
  const L = setAt(g,'L'), R = setAt(g,'R'), Ls = L ? S.seats[L.m] : {}, Rs = R ? S.seats[R.m] : {};
  const pv = opts && opts.interactive && pendingL && pendingL.g===g && opts.cur ? pendingL : null;
  const canSwap = opts && opts.interactive && (pv || (L && Ls.top!=null));
  return `<div class="group"><div class="gt">${g}모둠${canSwap?`<button class="gswap no-print" data-gswap="${g}" title="누를 때마다 멘티 위·아래 자리가 바뀌어요">↕ 멘티 자리 바꾸기</button>`:''}</div><div class="ggrid">`
    + (pv ? pvCell(pv.top,'top',opts.cur,g,true) : cell(L?Ls.top:null,'top',L,g,'L',opts))
    + (pv ? pvCell(opts.cur.m,'mseat',opts.cur,g,false) : cell(L?L.m:null,'mseat',L,g,'L',opts)) + cell(R?Rs.bot:null,'',R,g,'R',opts)
    + (pv ? pvCell(pv.bot,'',opts.cur,g,true) : cell(L?Ls.bot:null,'',L,g,'L',opts)) + cell(R?R.m:null,'mseat',R,g,'R',opts)
    + `</div></div>`;
}
function boardHTML(opts){ return `<div class="board ${opts&&opts.big?'big':''} ${opts&&opts.interactive?'live':''}">${GROUPS_TOP.map(g=>groupHTML(g,opts)).join('')}${GROUPS_BOTTOM.map(g=>groupHTML(g,opts)).join('')}<div class="teacher-desk">교탁</div></div>`; }
function renderSeat(){
  const cur = curSeatTeam(), to = teamOrder();
  const unteamed = order().filter(x=>!teamOf(x.no)).length;
  const label = st => st ? `${st.g}모둠 ${st.s==='L'?'왼쪽':'오른쪽'}` : '';
  let side = `<div class="panel order"><h2>팀 차례</h2>${to.map((t,k)=>`<div class="it ${S.seats[t.m]?'done':''} ${cur&&cur.m===t.m?'cur':''}" style="cursor:pointer;" data-st="${t.m}"><span class="rk">${k+1}</span><span style="width:10px;height:10px;border-radius:50%;background:${teamColor(t)};display:inline-block;"></span><span class="nm">${esc([t.m,...t.e].map(n=>byNo(n)?byNo(n).name:n).join(' · '))}</span>${S.seats[t.m]?`<span class="sc" style="width:auto;">${label(S.seats[t.m])}</span>`:''}</div>`).join('') || '<span class="hint">먼저 ② 짝을 정해요.</span>'}</div>`;
  let top = '';
  if(unteamed) top += `<div class="notice">아직 팀이 없는 학생이 ${unteamed}명 있어요. ② 짝 정하기를 먼저 마치면 좋아요.</div>`;
  if(cur && pendingL){
    top += `<div class="turn no-print"><div class="who">${pendingL.g}모둠 왼쪽 묶음 — 이렇게 앉을까요?</div>
      <div class="what">자리판에 <b>깜박이는 이름</b>으로 미리 보여 줘요. 멘토 ${esc(nm(cur.m))}는 노란 자리, <b>위 자리</b> ${esc(nm(pendingL.top))}, <b>아래 자리</b> ${esc(nm(pendingL.bot))}.<br>
      [↕ 멘티 자리 바꾸기]를 누를 때마다 위·아래 자리가 바뀌어요. 다른 왼쪽 묶음을 누르면 그쪽으로 옮겨요.</div>
      <div class="row" style="margin-top:6px;"><button class="btn" id="swapL">↕ 멘티 자리 바꾸기</button><button class="btn primary" id="confirmL">✔ 확정</button><button class="btn" id="cancelL">취소</button></div></div>`;
  } else if(cur) top += `<div class="turn no-print"><div class="who">지금 차례: ${esc([cur.m,...cur.e].map(n=>byNo(n)?byNo(n).name:n).join(' · '))} <span style="font-size:15px;color:#666;">(${cur.e.length+1}명)</span></div>
    <div class="what">원하는 모둠의 <b>세로 묶음</b>을 눌러요. 멘토는 노란 자리에 앉아요. 다른 팀이 먼저 고르게 하려면 왼쪽 '팀 차례' 목록에서 그 팀을 눌러요.<br>
    ${cur.e.length>=2 ? '3명 팀은 <b>왼쪽 묶음</b>(멘토 + 멘티 위·아래 자리)만 앉을 수 있어요. 누르면 바로 앉고, 멘티 위·아래는 모둠 제목줄의 [↕ 멘티 자리 바꾸기]로 바꿔요.' : '2명 팀은 왼쪽 묶음(멘티는 아래 자리, 위 자리는 비워요)이나 오른쪽 묶음 어디든 앉을 수 있어요.'} </div>
    <div class="row" style="margin-top:8px;align-items:center;">
      ${seatPick!=null ? `<button class="btn" id="pickReset">↩ 원래 순서로</button>` : ''}
    </div>
    ${seatPick!=null ? `<p class="hint" style="margin-top:4px;">선생님이 고른 팀이 먼저 고르는 중이에요. 자리를 정하면 다시 원래 순서(발표 많은 순)로 돌아가요.</p>` : ''}</div>`;
  else if(S.teams.length) top += `<div class="ok-msg">🎉 모든 팀의 자리가 정해졌어요. ④ 자리표에서 크게 볼 수 있어요.</div>`;
  top += `<div class="row no-print" style="margin:8px 0;"><button class="btn" id="undoBtn2" ${undoStack.length?'':'disabled'}>↶ 되돌리기</button><button class="btn danger" id="resetSeats">자리 모두 지우기</button></div>`;
  $('t-seat').innerHTML = `<div class="board-wrap">${side}<div>${top}<div class="panel">${boardHTML({interactive:true, cur})}<p class="hint" style="margin-top:8px;">모둠마다 왼쪽 묶음 = 위 자리·노랑(멘토)·아래 자리, 오른쪽 묶음 = 멘티·노랑(멘토). 노란 자리가 멘토 자리예요. 3명 팀은 모둠 제목줄의 [↕ 멘티 자리 바꾸기]를 누를 때마다 위·아래 자리가 바뀌고, 멘토(노란 자리)를 누르면 묶음을 비울 수 있어요.</p></div></div></div>`;
}
/* 같은 묶음 자리를 함께 강조 */
document.addEventListener('mouseover', e=>{
  const c = e.target.closest && e.target.closest('.board.live .seat[data-g]');
  document.querySelectorAll('.board.live .seat.hov').forEach(x=>x.classList.remove('hov'));
  if(c) document.querySelectorAll(`.board.live .seat[data-g="${c.dataset.g}"][data-s="${c.dataset.s}"]`).forEach(x=>x.classList.add('hov'));
});
document.addEventListener('click', e=>{
  if(tab!=='seat') return;
  const st = e.target.closest && e.target.closest('[data-st]'); if(st){ const m = +st.dataset.st; if(!S.seats[m]){ seatPick = m; pendingL = null; renderSeat(); } return; }
  const b0 = e.target.closest && e.target.closest('button');
  if(pendingL && b0 && (b0.id==='swapL' || (b0.dataset.gswap && +b0.dataset.gswap===pendingL.g))){ pendingL = Object.assign({}, pendingL, {top:pendingL.bot, bot:pendingL.top}); renderSeat(); return; }
  if(b0 && b0.id==='confirmL' && pendingL){
    const cur = curSeatTeam(), pv = pendingL; pendingL = null;
    if(!cur || setAt(pv.g,'L') || !cur.e.includes(pv.top) || !cur.e.includes(pv.bot)){ renderSeat(); return; }
    commit(()=>{ S.seats[cur.m] = {g:pv.g, s:'L', top:pv.top, bot:pv.bot}; }); seatPick = null; return;
  }
  if(b0 && b0.dataset.gswap && !pendingL){ const t = setAt(+b0.dataset.gswap,'L'); if(t && S.seats[t.m].top!=null) commit(()=>{ const x = S.seats[t.m]; [x.top, x.bot] = [x.bot, x.top]; }); return; }
  if(b0 && b0.id==='pickReset'){ seatPick = null; renderSeat(); return; }
  if(b0 && b0.id==='cancelL'){ pendingL = null; renderSeat(); return; }
  const c = e.target.closest && e.target.closest('.board.live .seat[data-g]');
  if(c){
    const g = +c.dataset.g, side = c.dataset.s, t = setAt(g,side), cur = curSeatTeam();
    if(t){
      const stt = S.seats[t.m];
      if(side==='L' && stt.top!=null && !c.classList.contains('mseat')) return; // 멘티 위·아래는 모둠 제목줄의 [↕ 멘티 자리 바꾸기] 버튼으로
      if(confirm(`${g}모둠 ${side==='L'?'왼쪽':'오른쪽'} 묶음(${[t.m,...t.e].map(n=>byNo(n)?byNo(n).name:n).join(', ')})을 비울까요?`)) commit(()=>{ delete S.seats[t.m]; });
      return;
    }
    if(!cur) return;
    if(!canSit(cur,g,side)){ const w = whyNot(cur,g,side); if(w && w!=='이미 찬 자리') alert(w); return; }
    // 3명 팀도 누르면 바로 앉는다(위 자리 = 첫 멘티). 위·아래는 모둠 제목줄 [↕ 멘티 자리 바꾸기]로 바꾼다
    if(side==='L' && cur.e.length>=2){ commit(()=>{ S.seats[cur.m] = {g, s:'L', top:cur.e[0], bot:cur.e[1]}; }); seatPick = null; return; }
    commit(()=>{ S.seats[cur.m] = side==='L' ? {g, s:'L', top:null, bot:cur.e[0]} : {g, s:'R', bot:cur.e[0]}; }); seatPick = null; return;
  }
  if(!b0) return;
  if(b0.id==='undoBtn2'){ pendingL = null; undo(); return; }
  if(b0.id==='resetSeats'){ if(!confirm('자리를 모두 지울까요? (짝은 그대로예요)')) return; pendingL = null; commit(()=>{ S.seats = {}; }); return; }
});

/* ④ 자리표 */
function renderView(){
  if(S.mode==='pair'){
    const to = teamOrder();
    $('t-view').innerHTML = `<div class="panel"><div class="row no-print" style="justify-content:space-between;margin-bottom:8px;"><h2 style="margin:0;">2학년 ${esc(room)}반 멘토·멘티 매칭</h2><button class="btn" onclick="window.print()">🖨 인쇄</button></div>
      <table class="roster" style="font-size:17px;"><tr><th>팀</th><th>멘토</th><th>멘티 1</th><th>멘티 2</th></tr>${to.map((t,k)=>`<tr><td>${k+1}</td><td style="background:var(--mentor);font-weight:bold;">${esc(nm(t.m))}</td><td>${esc(t.e[0]!=null?nm(t.e[0]):'')}</td><td>${esc(t.e[1]!=null?nm(t.e[1]):'')}</td></tr>`).join('') || '<tr><td colspan="4" style="color:#999;">아직 정한 팀이 없어요.</td></tr>'}</table>
      ${order().filter(x=>!teamOf(x.no)).length ? `<p class="hint" style="color:#c62828;">아직 팀이 없는 학생: ${order().filter(x=>!teamOf(x.no)).map(x=>esc(x.no+' '+x.name)).join(', ')}</p>` : ''}</div>`;
    return;
  }
  const seated = Object.keys(S.seats).length;
  $('t-view').innerHTML = `<div class="panel"><div class="row no-print" style="justify-content:space-between;margin-bottom:8px;"><h2 style="margin:0;">2학년 ${esc(room)}반 자리표</h2><div class="row"><span class="hint">자리 정한 팀 ${seated}/${S.teams.length}</span><button class="btn" onclick="printSheet(false)" title="교탁이 아래 — 교사가 보는 방향">🖨 교사용 인쇄</button><button class="btn" onclick="printSheet(true)" title="교탁이 위 — 학생이 교탁을 보는 방향(위아래 뒤집기)">🖨 학생용 인쇄</button><button class="btn" id="xlsxOut" onclick="exportXlsx()" title="교사용 자리표를 5~8반 한 시트에 나란히 — 이름 아래 발표 칸(빈칸)">📥 엑셀 저장 (5~8반)</button></div></div>
    <h2 style="display:none;" class="print-only">2학년 ${esc(room)}반 자리표</h2>${boardHTML({big:true})}</div>`;
}

/* 자리표 인쇄: 교사용(교탁 아래) / 학생용(180° 돌림, 교탁 위) */
function sheetHTML(student){
  const nmOnly = n => n!=null && byNo(n) ? esc(byNo(n).name) : '';
  const grp = g => { // 모둠 하나 → 3줄 [{n, m(멘토), span}]
    const L = setAt(g,'L'), R = setAt(g,'R'), Ls = L ? S.seats[L.m] : {}, Rs = R ? S.seats[R.m] : {};
    const top = [{n:L?Ls.top:null, span:2}], mid = [{n:L?L.m:null, m:1}, {n:R?Rs.bot:null}], bot = [{n:L?Ls.bot:null}, {n:R?R.m:null, m:1}];
    return student ? [bot.slice().reverse(), mid.slice().reverse(), top] : [top, mid, bot];
  };
  const band = gs => {
    let h = '<tr>' + gs.map(g=>`<td class="h gl gr" colspan="2">${g}모둠</td>`).join('') + '</tr>';
    const rows = gs.map(grp);
    for(let r=0;r<3;r++){
      h += `<tr class="${r===2?'gb':''}">` + rows.map(rs => rs[r].map((c,k,arr)=>`<td class="${c.m?'m':''} ${k===0?'gl':''} ${k===arr.length-1?'gr':''}" ${c.span?'colspan="2"':''}>${nmOnly(c.n)}</td>`).join('')).join('') + '</tr>';
    }
    return h;
  };
  const desk = '<tr><td class="sp" colspan="2"></td><td class="desk" colspan="2">교탁</td><td class="sp" colspan="2"></td></tr>';
  const title = `<tr><td class="title" colspan="6">2학년 ${esc(room)}반</td></tr>`;
  const sp = '<tr><td class="sp" colspan="6"></td></tr>';
  const body = student
    ? title + sp + desk + sp + band([1,2,3]) + band([4,5,6])
    : title + band([6,5,4]) + band([3,2,1]) + sp + desk;
  return `<table class="ps-t">${body}<tr><td class="who" colspan="6">${student?'학생용 (교탁이 앞)':'교사용 (교탁에서 본 방향)'}</td></tr></table>`;
}
function printSheet(student){
  $('printSheet').innerHTML = sheetHTML(student);
  document.body.classList.add('ps');
  const done = () => { document.body.classList.remove('ps'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}
window.printSheet = printSheet;

/* 교사용 자리표 엑셀 저장: 선생님 구글 시트('7월 발표')와 같은 모양 — 5~8반을 한 시트에 나란히(반마다 6칸),
   모둠마다 [위 자리(2칸 합침)] / [멘토][멘티] / [멘티][멘토], 이름 아래 줄은 발표 칸(빈칸). 멘토 = 노랑 */
const XLSX_ROOMS = ['5','6','7','8'];
function seatCells(st, g){
  const nmO = no => { const x = no!=null ? st.roster.find(y=>y.no===no) : null; return x ? x.name : ''; };
  const at = side => { const k = Object.keys(st.seats).find(m=> st.seats[m].g===g && st.seats[m].s===side); return k!=null ? {m:+k, ...st.seats[k]} : null; };
  const L = at('L'), R = at('R');
  return { top: nmO(L&&L.top), Lm: nmO(L&&L.m), Rb: nmO(R&&R.bot), Lb: nmO(L&&L.bot), Rm: nmO(R&&R.m) };
}
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((ok, no)=>{ const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; sc.onload = ok; sc.onerror = ()=>no(new Error('엑셀 도구를 불러오지 못했어요.')); document.head.appendChild(sc); });
}
async function exportXlsx(){
  const btn = $('xlsxOut'); if(btn){ btn.disabled = true; btn.textContent = '⏳ 만드는 중…'; }
  try{
    await loadExcelJS();
    const states = {};
    for(const c of XLSX_ROOMS){
      if(c===room) states[c] = S;
      else if(db){ const v = (await db.ref('rooms/'+c+SUFFIX).once('value')).val(); states[c] = normalize(v || DEFAULTS[c]); }
      else states[c] = normalize(DEFAULTS[c]);
    }
    const now = new Date(), wb = new ExcelJS.Workbook(), ws = wb.addWorksheet(`${now.getMonth()+1}월 발표`, {pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:1}});
    const THIN = {style:'thin', color:{argb:'FF000000'}}, THICK = {style:'medium', color:{argb:'FF000000'}};
    const YEL = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFF2CC'}};
    ws.columns = Array.from({length: XLSX_ROOMS.length*6}, ()=>({width:10}));
    const put = (r, c, v, o={}) => { const cell = ws.getCell(r, c); cell.value = v; cell.alignment = {horizontal:'center', vertical:'middle'}; cell.font = {size:o.size||12, bold:!!o.bold, name:'맑은 고딕'};
      if(o.fill) cell.fill = YEL; cell.border = {top:o.bt?THICK:THIN, bottom:o.bb?THICK:THIN, left:o.bl?THICK:THIN, right:o.br?THICK:THIN}; return cell; };
    const merge = (r1,c1,r2,c2) => ws.mergeCells(r1,c1,r2,c2);
    XLSX_ROOMS.forEach((rm, k)=>{
      const st = states[rm], c0 = 1 + k*6;
      put(1, c0, `2학년 ${rm}반`, {bold:true, size:13, bt:1, bb:1, bl:1, br:1}); for(let j=1;j<6;j++) put(1, c0+j, null, {bt:1, bb:1, br:j===5}); merge(1,c0,1,c0+5);
      [[6,5,4],[3,2,1]].forEach((gs, band)=>{
        const r0 = 2 + band*7; // 모둠 머리줄
        gs.forEach((g, gi)=>{
          const c = c0 + gi*2, x = seatCells(st, g);
          put(r0, c, `${g}모둠`, {bold:true, bt:1, bl:1}); put(r0, c+1, null, {bt:1, br:1}); merge(r0,c,r0,c+1);
          // 위 자리(2칸 합침) + 발표 칸
          put(r0+1, c, x.top, {bl:1}); put(r0+1, c+1, null, {br:1}); merge(r0+1,c,r0+1,c+1);
          put(r0+2, c, null, {bl:1}); put(r0+2, c+1, null, {br:1}); merge(r0+2,c,r0+2,c+1);
          // [멘토][멘티] / [멘티][멘토] — 이름 줄 + 발표 줄
          [[x.Lm, true, x.Rb, false], [x.Lb, false, x.Rm, true]].forEach(([a, am, b, bm], i)=>{
            const r = r0 + 3 + i*2, last = i===1;
            put(r, c, a, {fill:am, bl:1}); put(r, c+1, b, {fill:bm, br:1});
            put(r+1, c, null, {fill:am, bl:1, bb:last}); put(r+1, c+1, null, {fill:bm, br:1, bb:last});
          });
        });
      });
      const rd = 17; put(rd, c0+2, '교탁', {bold:true, bt:1, bb:1, bl:1, br:1}); put(rd, c0+3, null, {bt:1, bb:1, br:1}); merge(rd,c0+2,rd,c0+3);
      ws.getCell(19, c0).value = '업데이트 시간'; ws.getCell(19, c0).font = {size:10, name:'맑은 고딕'};
    });
    for(let r=1;r<=17;r++) ws.getRow(r).height = 22;
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download = `자리배치_5-8반_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}.xlsx`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(err){ alert('엑셀 저장에 실패했어요: ' + err.message); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = '📥 엑셀 저장 (5~8반)'; } }
}
window.exportXlsx = exportXlsx;

/* ---------- 시작 ---------- */
(function init(){
  const tabs = $('classTabs');
  for(let i=1;i<=12;i++){ const b = document.createElement('button'); b.textContent = i+'반'; b.dataset.c = String(i); b.addEventListener('click', ()=> loadRoom(String(i))); tabs.appendChild(b); }
  document.querySelectorAll('#tabs button').forEach(b=> b.addEventListener('click', ()=>{ tab = b.dataset.t; render(); }));
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebase.auth().signInAnonymously().catch(()=>{}).finally(()=> loadRoom(room));
  }catch(err){ db = null; $('saveState').textContent = '⚠️ 연결 실패 — 저장되지 않아요'; loadRoom(room); }
})();
</script>
